[package]
name = "postgres"

# The Postgres nodes: run queries and write rows over a user-supplied
# connection string. A database credential is not an HTTP credential,
# so it rides an ordinary input rather than the access system (the
# documented carve-out for non-HTTP credentials).
[dependencies]
async-trait = "0.1"
serde_json = "1"
tokio = "1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
tokio-postgres-rustls = "0.13"
rustls = "0.23"
webpki-roots = "0.26"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
