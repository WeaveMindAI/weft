[package]
name = "logic"

# The control-flow nodes: branching (`Switch`, `Dispatch`, `FirstInOrder`,
# `All`, `Not`), runs steering each other by tag (`TagRun`, `StopTagged`),
# and reading the project's runs (`ListRuns`, `CountRuns`, `GetRunId`,
# `GetNodeState`). `regex` is
# Switch's `matches` test; Switch and Dispatch share `compare.rs`, the
# steering pair shares `steering.rs`, the runs pair shares `runs.rs`.
[dependencies]
regex = "1"
