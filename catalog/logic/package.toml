[package]
name = "logic"

# The control-flow nodes: branching (`Switch`, `FirstInOrder`, `All`,
# `Not`), runs steering each other by tag (`TagRun`, `StopTagged`), and
# reading the project's runs (`ListRuns`, `CountRuns`). `regex` is
# Switch's `matches` test; the steering pair shares `steering.rs`, the
# runs pair shares `runs.rs`.
[dependencies]
regex = "1"
sha2 = "0.10"
