# ExecPython runs each script in a `python3` process the worker starts
# (see mod.rs), so the worker image needs the interpreter and its
# standard library at runtime, and nothing at build time.

[dependencies]

[system.runtime.apt]
default = ["python3"]

[system.runtime.apk]
default = ["python3"]

[system.runtime.yum]
default = ["python3"]
