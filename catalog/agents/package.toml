[package]
name = "agents"
# Inside a Computer, an agent node installs and starts its server with the
# computer's own command and app code (`computer::command`, `computer::apps`).
uses = ["computer"]

# The coding agents people already use (Claude Code, Codex, and every other
# one with a headless protocol), driven from a weft program. Each agent is
# an infra node holding ONE conversation, through a small agent server it
# starts beside the agent (`server/`, Python, standard library only): as a
# process on the person's own machine, or inside the Computer the node is
# wired to. `AskAgent` sends it a message and comes back with its reply, a
# call of one of the program's own tools, or a question for a person, which
# `AnswerAgent` turns into a form. What every agent node shares is
# `agent.rs`; what differs between agents is the server's `agents.json` and
# its adapters.
[dependencies]
async-trait = "0.1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
