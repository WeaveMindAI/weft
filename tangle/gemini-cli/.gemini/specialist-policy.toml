# The trial of its prompt (its agent file, under The trial), in exactly this
# shape: from an empty folder, a headless `gemini` with no tools, reading
# its input from `.scratch/prompt-engineer/`. The first rule matches the
# whole command, the second the part after `cd`.
[[rule]]
subagent = "prompt-engineer"
toolName = "run_shell_command"
commandRegex = "cd /[^ ;&|<>\"]+ && GEMINI_SYSTEM_MD=(?![^ ]*/(\\.scratch|tmp)/)(/[^ ;&|<>\"]+)/assets/prompts/[^ ;&|<>\"]+ gemini -m (flash-lite|flash|pro) --policy \\2/\\.gemini/trial-no-tools\\.toml --skip-trust < \\2/\\.scratch/prompt-engineer/[^ ;&|<>\"]+\""
decision = "allow"
priority = 850
allowRedirection = true
modes = ["default", "autoEdit"]

[[rule]]
subagent = "prompt-engineer"
toolName = "run_shell_command"
commandRegex = "GEMINI_SYSTEM_MD=(?![^ ]*/(\\.scratch|tmp)/)(/[^ ;&|<>\"]+)/assets/prompts/[^ ;&|<>\"]+ gemini -m (flash-lite|flash|pro) --policy \\2/\\.gemini/trial-no-tools\\.toml --skip-trust\""
