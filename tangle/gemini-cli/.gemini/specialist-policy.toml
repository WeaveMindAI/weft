# A specialist never waits on a permission prompt.
#
# Tangle's specialists are Gemini subagents. When one of them makes a call
# that needs approval, Gemini asks the user and the subagent waits, with its
# `timeout_mins` clock stopped, until somebody answers, and nobody may be
# looking. So these rules answer for the user, one block per specialist,
# naming only what that specialist's job needs: the reads, the `weft` verbs
# it runs, the exact frontend commands the two that build the site use, and,
# for the five that write files, their edits, in `default` mode as well as
# `autoEdit`. Every block refuses, above its allows, the daemon's lifecycle
# (`weft daemon start`, its alias `restart`, `stop` and `remove`), any
# command naming another install (`--on`, `--dispatcher`; the deployer's
# block alone allows those), a quote or backslash glued to a flag name, any
# redirection other than the validate run's stdin and the prompt-engineer's
# trial, the live tier of `weft test-node`, and any edit under `.gemini/`.
# Anything else that would have asked is refused at once, with a message
# telling the specialist to do it another way or report BLOCKED with the
# command. Tangle itself is not named here, so its own calls still ask the
# user exactly as before.
#
# A rule's `subagent` takes one name, the `name` in an agent file, so the
# reads every specialist shares are written out in each block, and a new
# specialist needs a block of its own. The rules apply only in the
# `default` and `autoEdit` approval modes: in `yolo` nothing asks.
#
# Loaded through `policyPaths` in `.gemini/settings.json`, as a user-tier
# policy. Setting `policyPaths` stops Gemini reading `~/.gemini/policies/`
# on its own, which is why the settings name it too.
#
# One question still gets through: Gemini asks before any edit to a build
# file (`package.json`, a lockfile, a `Dockerfile`, `Cargo.toml`) after the
# rules have answered, whatever they said.

# ---- node-smith
[[rule]]
subagent = "node-smith"
toolName = "run_shell_command"
commandRegex = ".*--(on|dispatcher)[ ='\\\\]"
decision = "deny"
priority = 950
denyMessage = "a cloud install is the deployer's alone: never pass --on or --dispatcher, report BLOCKED with the command"
modes = ["default", "autoEdit"]

# A quote or a backslash glued to a flag name (`--o''n`) is how a flag hides from the rules above.
[[rule]]
subagent = "node-smith"
toolName = "run_shell_command"
commandRegex = ".*--[a-z-]*['\\\\]"
decision = "deny"
priority = 950
denyMessage = "write every flag plainly, with no quote or backslash in its name"
modes = ["default", "autoEdit"]

# The live tier calls the real service and spends money: the user runs it, never a specialist.
# Any `--tier` but a plain `basic` or `fake` is refused, and so is `--yes`.
[[rule]]
subagent = "node-smith"
toolName = "run_shell_command"
commandRegex = "weft test-node .*--tier(?![ =](basic|fake)[ \"])"
decision = "deny"
priority = 950
denyMessage = "the live tier is the user's to run, through /weft-live-test: report it in your report"
modes = ["default", "autoEdit"]

[[rule]]
subagent = "node-smith"
toolName = "run_shell_command"
commandRegex = "weft test-node .*--yes"
decision = "deny"
priority = 950
denyMessage = "the live tier is the user's to run, through /weft-live-test: report it in your report"
modes = ["default", "autoEdit"]

[[rule]]
subagent = "node-smith"
toolName = "run_shell_command"
commandPrefix = ["weft daemon start", "weft daemon stop", "weft daemon restart", "weft daemon remove"]
decision = "deny"
priority = 900
denyMessage = "the daemon is never a specialist's to start, stop, restart or remove: report BLOCKED with the command"
modes = ["default", "autoEdit"]

# The validate run reads its file on stdin, so this one form may redirect.
[[rule]]
subagent = "node-smith"
toolName = "run_shell_command"
commandRegex = "weft validate --file [^ ;&|<>\"]+ < [^ ;&|<>\"]+\""
decision = "allow"
priority = 850
allowRedirection = true
modes = ["default", "autoEdit"]

# Any other redirection is refused rather than put to the user.
[[rule]]
subagent = "node-smith"
toolName = "run_shell_command"
commandRegex = ".*[<>]"
decision = "deny"
priority = 840
denyMessage = "no redirection here: one plain command per call, or report BLOCKED with the command"
modes = ["default", "autoEdit"]

[[rule]]
subagent = "node-smith"
toolName = "run_shell_command"
commandPrefix = ["cd", "weft validate", "weft parse", "weft describe-nodes", "weft status", "weft ps", "weft executions", "weft events", "weft logs", "weft follow", "weft daemon status", "weft daemon logs", "weft files ls", "weft files inspect", "weft infra status", "weft infra logs", "weft infra show", "weft infra list-doors", "weft tree", "weft examples", "weft diff", "weft test-node", "weft node-test-hash", "weft run", "weft bake", "weft stop", "weft cancel-running", "weft catalog update", "weft new", "weft infra start", "weft infra stop", "weft infra upgrade", "weft infra rebake", "weft infra terminate"]
decision = "allow"
priority = 800
modes = ["default", "autoEdit"]

[[rule]]
subagent = "node-smith"
toolName = ["read_file", "read_many_files", "list_directory", "glob", "grep_search", "google_web_search", "activate_skill", "complete_task", "update_topic", "list_background_processes", "read_background_output"]
decision = "allow"
priority = 800
modes = ["default", "autoEdit"]

# Tangle's own files, this policy and the trial's included, are never a specialist's to edit.
[[rule]]
subagent = "node-smith"
toolName = ["write_file", "replace"]
argsPattern = "\"file_path\":\"[^\"]*\\.gemini/"
decision = "deny"
priority = 750
denyMessage = "the files under .gemini/ belong to weft: never edit them"
modes = ["default", "autoEdit"]

[[rule]]
subagent = "node-smith"
toolName = ["write_file", "replace", "web_fetch"]
decision = "allow"
priority = 700
modes = ["default", "autoEdit"]

[[rule]]
subagent = "node-smith"
toolName = "*"
decision = "deny"
priority = 100
denyMessage = "never wait on a permission prompt: do it another way, or report BLOCKED with the command"
modes = ["default", "autoEdit"]

