# ---- red-teamer
[[rule]]
subagent = "red-teamer"
toolName = "run_shell_command"
commandRegex = ".*--(on|dispatcher)[ ='\\\\]"
decision = "deny"
priority = 950
denyMessage = "a cloud install is the deployer's alone: never pass --on or --dispatcher, report BLOCKED with the command"
modes = ["default", "autoEdit"]

# A quote or a backslash glued to a flag name (`--o''n`) is how a flag hides from the rules above.
[[rule]]
subagent = "red-teamer"
toolName = "run_shell_command"
commandRegex = ".*--[a-z-]*['\\\\]"
decision = "deny"
priority = 950
denyMessage = "write every flag plainly, with no quote or backslash in its name"
modes = ["default", "autoEdit"]

[[rule]]
subagent = "red-teamer"
toolName = "run_shell_command"
commandPrefix = ["weft daemon start", "weft daemon stop", "weft daemon restart", "weft daemon remove"]
decision = "deny"
priority = 900
denyMessage = "the daemon is never a specialist's to start, stop, restart or remove: report BLOCKED with the command"
modes = ["default", "autoEdit"]

# The validate run reads its file on stdin, so this one form may redirect.
[[rule]]
subagent = "red-teamer"
toolName = "run_shell_command"
commandRegex = "weft validate --file [^ ;&|<>\"]+ < [^ ;&|<>\"]+\""
decision = "allow"
priority = 850
allowRedirection = true
modes = ["default", "autoEdit"]

# Any other redirection is refused rather than put to the user.
[[rule]]
subagent = "red-teamer"
toolName = "run_shell_command"
commandRegex = ".*[<>]"
decision = "deny"
priority = 840
denyMessage = "no redirection here: one plain command per call, or report BLOCKED with the command"
modes = ["default", "autoEdit"]

[[rule]]
subagent = "red-teamer"
toolName = "run_shell_command"
commandPrefix = ["cd", "weft validate", "weft parse", "weft describe-nodes", "weft status", "weft ps", "weft executions", "weft events", "weft logs", "weft follow", "weft daemon status", "weft daemon logs", "weft files ls", "weft files inspect", "weft infra status", "weft infra logs", "weft infra show", "weft infra list-doors", "weft tree", "weft examples", "weft diff"]
decision = "allow"
priority = 800
modes = ["default", "autoEdit"]

[[rule]]
subagent = "red-teamer"
toolName = ["read_file", "read_many_files", "list_directory", "glob", "grep_search", "google_web_search", "activate_skill", "complete_task", "update_topic", "list_background_processes", "read_background_output"]
decision = "allow"
priority = 800
modes = ["default", "autoEdit"]

[[rule]]
subagent = "red-teamer"
toolName = "*"
decision = "deny"
priority = 100
denyMessage = "never wait on a permission prompt: do it another way, or report BLOCKED with the command"
modes = ["default", "autoEdit"]

