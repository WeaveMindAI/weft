[package]
name = "weft-broker-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
weft-core = { workspace = true }
weft-journal = { workspace = true }
weft-task-store = { workspace = true }
# The platform identity every call presents (`token::TokenSource`).
weft-platform-traits = { workspace = true }

reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
# The line to the broker (`line`).
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
# The broker's half of the line (`line::server`), for the broker and for
# tests standing a fake broker up.
axum = { workspace = true, optional = true }
tower = { workspace = true, features = ["util"], optional = true }
bytes = { workspace = true, optional = true }

[features]
line-server = ["dep:axum", "dep:tower", "dep:bytes"]

[lints]
workspace = true

[dev-dependencies]
# `test-util` enables tokio's paused clock, so the read-retry backoff
# tests run without sleeping.
tokio = { workspace = true, features = ["test-util"] }
