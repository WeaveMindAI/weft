[package]
name = "weft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
# `.env` loading at CLI startup (provider keys, local overrides).
dotenvy = "0.15"
weft-core = { workspace = true }
weft-assets = { workspace = true }
weft-compiler = { workspace = true }
weft-catalog = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
eventsource-client = "0.13"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
terminal_size = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
# User-level CLI settings file (`~/.config/weft/cli.toml`).
toml = { workspace = true }
# Local-time rendering of the journal's unix stamps (`weft executions`,
# `weft events`, `weft logs`).
chrono = { workspace = true }
# Hidden-echo terminal input for pasted credentials (`weft connect`).
rpassword = { workspace = true }
# Open the browser on the OAuth consent URL (`weft connect`).
open = { workspace = true }
sha2 = { workspace = true }
ipnet = { workspace = true }

[lints]
workspace = true
