# Deploys this project onto its weft install on GCP: the program first
# (`weft infra upgrade`, then `weft resync`, which only bring up to date
# what is running and on, and never turn anything on), then, when the
# install hosts a frontend for this repository (`weft frontend add`), the
# frontend in front/ to its Cloud Run service. It calls the install
# at its public address with its token, and reaches the program's own
# infrastructure (a database) privately through Direct VPC egress. Run it
# by hand from the Actions tab.
#
# Its repository variables and secrets come from
# `weft target export <target> --github`.
#
# The frontend contract: front/Dockerfile builds a server that listens on
# $PORT and reads WEFT_DISPATCHER_URL (the install), WEFT_TOKEN (a
# caller token, never sent to a browser) and WEFT_PUBLIC_URL (for links a
# browser follows), plus whatever else the WEFT_FRONT_ENV secret holds (the
# program's database address and credentials, its sign-in secret), in the
# dotenv form `weft infra env --into` writes. If the frontend is not built
# that way, only the "build the frontend" step changes.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A named release: `ubuntu-latest` moves to a new one on GitHub's
    # schedule, under a workflow that worked the day before. The same as
    # the install workflow's, whose CLI this job downloads and runs.
    # SYNC: runs-on <-> .github/workflows/install-gcp.yml (runs-on, store the weft CLI in the install)
    runs-on: ubuntu-24.04
    env:
      # What happens to the runs going when the deploy replaces what they
      # run on: `wait` (they finish on the version they started on, and the
      # deploy waits for them, however long that takes) or `cancel` (they
      # stop at once).
      RUNNING: wait
      WEFT_OPERATOR_KEY: ${{ secrets.WEFT_OPERATOR_KEY }}
      WEFT_REPO_ROOT: ${{ github.workspace }}/.weft
      # Frontends push to the install's frontend repository
      # (`<registry>-frontends`), never to the one the runtime pulls from.
      # SYNC: the frontend repository <-> deploy/terraform/gcp/registry.tf (frontends)
      FRONT_IMAGE: ${{ vars.GCP_ARTIFACT_REGISTRY }}-frontends/{{SERVICE}}-front:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # The weft the install runs, asked of the install itself on every run,
      # so an install upgraded since `weft target export` is followed here
      # with no setting to change. The CLI below is that weft's own (it
      # reads the project's nodes from this source), so what it sends is
      # what the install expects. It is downloaded from the install itself,
      # which stores the CLI its install workflow used, else from weft's
      # release of that source (waited for while it is still being built),
      # otherwise it is built here from a cache that keeps the dependencies
      # between runs, so a newer weft compiles only what changed in it.
      - name: ask the install which weft it runs
        id: source
        run: |
          install=$(curl -fsS -H "Authorization: Bearer $WEFT_OPERATOR_KEY" "${{ vars.WEFT_PUBLIC_URL }}/install")
          repository=$(jq -r '.source.repository // empty' <<<"$install")
          commit=$(jq -r '.source.commit // empty' <<<"$install")
          if [ -z "$repository" ] || [ -z "$commit" ]; then
            echo "::error::${{ vars.WEFT_PUBLIC_URL }} does not say which weft it runs, so there is no CLI to deploy with; run its install workflow again"
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: .weft

      - name: download the weft CLI
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if .weft/scripts/release-cli.sh .weft "$RUNNER_TEMP/weft" "${{ vars.WEFT_PUBLIC_URL }}"; then
            echo "$RUNNER_TEMP/weft" >> "$GITHUB_PATH"
            echo "found=yes" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" -eq 2 ] || exit "$rc"
          fi

      - if: steps.download.outputs.found != 'yes'
        working-directory: .weft
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.download.outputs.found != 'yes'
        with:
          workspaces: .weft -> target
          # A run that fails after compiling keeps its compile for the next run.
          cache-on-failure: true
      - name: build the weft CLI
        if: steps.download.outputs.found != 'yes'
        working-directory: .weft
        run: |
          cargo build --release --locked -p weft-cli
          echo "$WEFT_REPO_ROOT/target/release" >> "$GITHUB_PATH"

      # The program's infra first, then its triggers, the program's own and
      # every instance's (`--all`). The upgrade builds, then replaces with this build
      # only the infra already running, the triggers reading it held down
      # meanwhile. The resync registers this version and brings onto it
      # only the triggers that are on and behind it: taken down with what
      # arrives meanwhile held, their paused runs moved onto the new
      # build, and back on once the old version is done (this log names the
      # runs it waits for meanwhile, each time they change). Neither turns
      # anything on, so on a first deploy they leave the version ready for
      # `weft infra start --on <target>` and `weft activate --on <target>`,
      # run once by hand; a trigger or infra someone took down stays down.
      - name: deploy the program
        run: |
          weft infra upgrade --on ${{ vars.WEFT_TARGET }} --all --running "$RUNNING"
          weft resync --on ${{ vars.WEFT_TARGET }} --all --running "$RUNNING"

      # Everything below is the frontend's, and runs only when the install
      # hosts one for this repository (`weft frontend add <name> --repo
      # <this repository>`, then `weft target export`): a project without
      # one deploys its program and stops, and needs no GCP access at all.
      - uses: google-github-actions/auth@v3
        if: vars.WEFT_FRONTEND_SERVICE != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        if: vars.WEFT_FRONTEND_SERVICE != ''

      - name: build the frontend
        if: vars.WEFT_FRONTEND_SERVICE != ''
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$FRONT_IMAGE" front
          docker push "$FRONT_IMAGE"

      - name: deploy the frontend
        if: vars.WEFT_FRONTEND_SERVICE != ''
        env:
          WEFT_FRONT_ENV: ${{ secrets.WEFT_FRONT_ENV }}
          WEFT_DISPATCHER_URL: ${{ vars.WEFT_PUBLIC_URL }}
          WEFT_PUBLIC_URL: ${{ vars.WEFT_PUBLIC_URL }}
          WEFT_TOKEN: ${{ secrets.WEFT_FRONTEND_TOKEN }}
        run: |
          # Every variable the server reads, as the YAML Cloud Run takes:
          # the frontend's own (a dotenv file) first, weft's three last so
          # they always win.
          python3 - > "$RUNNER_TEMP/front-env.yaml" <<'PY'
          import json, os
          env = {}
          for line in os.environ.get("WEFT_FRONT_ENV", "").splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              name, value = line.split("=", 1)
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = value[1:-1]
              env[name.strip()] = value
          for name in ("WEFT_DISPATCHER_URL", "WEFT_PUBLIC_URL", "WEFT_TOKEN"):
              env[name] = os.environ[name]
          for name, value in env.items():
              print(f"{name}: {json.dumps(value)}")
          PY
          # The install made this frontend's own service, already public,
          # and it is the only one this workflow may change.
          service="${{ vars.WEFT_FRONTEND_SERVICE }}"
          gcloud run deploy "$service" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$FRONT_IMAGE" \
            --service-account "${{ vars.GCP_FRONTEND_SERVICE_ACCOUNT }}" \
            --network "${{ vars.GCP_NETWORK }}" \
            --subnet "${{ vars.GCP_SUBNET }}" \
            --vpc-egress private-ranges-only \
            --env-vars-file "$RUNNER_TEMP/front-env.yaml"
          rm "$RUNNER_TEMP/front-env.yaml"
          # The address weft recorded for it, the same shape as the
          # install's own (Cloud Run's main `status.url` is another one).
          url=$(weft frontend ls --on ${{ vars.WEFT_TARGET }} --json | jq -r --arg name "${{ vars.WEFT_FRONTEND_NAME }}" '.[] | select(.name == $name) | .url')
          echo "frontend: $url" | tee -a "$GITHUB_STEP_SUMMARY"

      # The frontend now calls with the token this deploy gave it (named by
      # its id, so a token made since and not deployed is never put in its
      # place), and every other token of it is retired.
      - name: retire the frontend's old token
        if: vars.WEFT_FRONTEND_SERVICE != ''
        run: weft frontend token "${{ vars.WEFT_FRONTEND_NAME }}" --done "${{ vars.WEFT_FRONTEND_TOKEN_ID }}" --on ${{ vars.WEFT_TARGET }}
