[package]
name = "weft-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The one binary every install runs: every role weft has (dispatcher,
# broker, listener, holder, supervisor), all in a local install's one
# process or each a service (the holder a pool) of its own, over the
# platform the install config names. Also the agent beside every infra
# unit (`weft-runtime unit-agent`).

[[bin]]
name = "weft-runtime"
path = "src/main.rs"

[dependencies]
weft-core = { workspace = true }
weft-dispatcher = { path = "../weft-dispatcher" }
weft-broker = { path = "../weft-broker" }
weft-broker-client = { path = "../weft-broker-client" }
# The documents its tables keep (`schema::documents`): their types and
# what re-derives from them.
weft-access-store = { workspace = true }
weft-journal = { workspace = true }
weft-listener = { path = "../weft-listener" }
weft-infra-supervisor = { path = "../weft-infra-supervisor" }
# `migrate`: the boot applies the schema and carries the documents
# (`schema::apply`), and the migration generator runs from here.
weft-task-store = { workspace = true, features = ["serve", "migrate"] }
weft-platform-traits = { workspace = true }
weft-platform-local = { workspace = true }
weft-platform-gcp = { workspace = true, features = ["control"] }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = "0.4"
base64 = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
# The process's allocator, the one every worker runs on
# (`weft_engine::Jemalloc`): it hands freed memory back to the system.
tikv-jemallocator = { workspace = true }
# `dup2`: the log moves the process's stderr onto each fresh file it rolls
# to (`log_file`).
libc = "0.2"
weft-workspace-hack = { version = "0.1", path = "../weft-workspace-hack" }

[dev-dependencies]
weft-platform-traits = { workspace = true, features = ["test-helpers"] }
tempfile = { workspace = true }
# Calling the tick route in its tests (`oneshot`).
tower = { workspace = true, features = ["util"] }
# `#[weft_db_macros::test]` hands each Layer-3 test a fresh database of
# its own on $DATABASE_URL, dropped after.
weft-db-macros = { workspace = true }
weft-task-store = { workspace = true, features = ["serve", "migrate", "test-helpers"] }

# The one migration generator, over every table group the install holds
# (`schema::groups`).
# SYNC: the example name <-> setup.sh (--migration's `--example`)
[[example]]
name = "schema_migration"
path = "examples/schema_migration.rs"

[lints]
workspace = true
