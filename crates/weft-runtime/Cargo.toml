[package]
name = "weft-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The one binary every install runs: every role weft has (dispatcher,
# broker, listener, supervisor), each placed on the machine or as a
# service of its own, over the platform the install config names. Also
# the agent beside every infra unit (`weft-runtime unit-agent`).

[[bin]]
name = "weft-runtime"
path = "src/main.rs"

[dependencies]
weft-core = { workspace = true }
weft-dispatcher = { path = "../weft-dispatcher" }
weft-broker = { path = "../weft-broker" }
weft-broker-client = { path = "../weft-broker-client" }
weft-listener = { path = "../weft-listener" }
weft-infra-supervisor = { path = "../weft-infra-supervisor" }
weft-task-store = { workspace = true }
weft-platform-traits = { workspace = true }
weft-platform-local = { workspace = true }
weft-platform-gcp = { workspace = true, features = ["control"] }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = "0.4"
base64 = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
# The machine's front door: TLS it terminates itself, with certificates
# from an ACME authority (IP certificates need its profile support).
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
x509-parser = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
weft-platform-traits = { workspace = true, features = ["test-helpers"] }
tempfile = { workspace = true }

[lints]
workspace = true
