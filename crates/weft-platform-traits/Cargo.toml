[package]
name = "weft-platform-traits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The translation layer's traits (one per platform capability), the
# S3-compatible object store every platform shares, and the fakes behind
# `test-helpers` so production builds don't link them.

[features]
default = []
test-helpers = ["dep:parking_lot"]

[dependencies]
async-trait = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
# The infra spec an `InfraHost` runs.
weft-core = { workspace = true }
uuid = { workspace = true }
# `WorkerCall` is read off the HTTP call weft makes to a worker.
reqwest = { workspace = true }
# Stable wake names (`alarm::Wake::name`).
sha2 = { workspace = true }
# S3-compatible object-store client (the production `ObjectStore` impl).
# Works against any S3 endpoint (GCS, SeaweedFS, AWS, a client's bucket)
# via an endpoint-URL override, which is exactly the deploy-time slot.
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-http-client = { workspace = true }
aws-credential-types = { workspace = true }
aws-smithy-types = { workspace = true }
# Fake-only lock. parking_lot's Mutex never poisons and lints cleanly
# against accidental cross-await holding (vs std's Mutex which clippy
# warns on but doesn't prevent). Behind the feature so production
# builds don't pull it.
parking_lot = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
# The crate's own tests build the fakes (`cfg(test)`) without the feature.
parking_lot = { workspace = true }
