# sleeps on (`PostgresJournalClient::raw_rows_after`).
weft-task-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
# The data step that fills the cost table hands the boot a boxed future
# (`weft_task_store::StepCode`).
futures = { workspace = true }
weft-workspace-hack = { version = "0.1", path = "../weft-workspace-hack" }

[lints]
workspace = true
