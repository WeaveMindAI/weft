[package]
name = "weft-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Self-registration of provider meters: each provider file submits its meter
# into a link-time-collected registry, so adding a provider needs no edit to
# any central list (same pattern weft-core uses for signal kinds).
inventory = { workspace = true }
# The shared percent_encode, and what a worker holds for its runs to share
# (`weft_core::shared`), where a meter keeps a price it looked up.
weft-core = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
# The response headers a meter reads its authoritative figure from
# (fal states the billed quantity in `X-Fal-Billable-Units`).
http = "1"
# The ElevenLabs session observer reads the session URL's query (audio
# format, add-on flags): the negotiated parameters price the bytes.
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
base64 = { workspace = true }

[lints]
workspace = true
