[package]
name = "weft-listener"
version = "0.2.0"
edition = "2021"

[dependencies]
weft-core = { path = "../weft-core" }
weft-task-store = { workspace = true }
weft-broker-client = { path = "../weft-broker-client" }
weft-platform-traits = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
base64 = { workspace = true }
cron = { workspace = true }
chrono-tz = { workspace = true }
# Feed-format polls (`PollFormat::Feed`): RSS/Atom parsed into the
# delta pipeline's item JSON.
feed-rs = "3"
dashmap = "6"
inventory = { workspace = true }
# A holder reads its own CPU time (`getrusage`) to say its load
# (`load`).
libc = "0.2"
# The folder watch kind hears a folder through the operating system's
# change events (inotify on Linux).
notify = "8"
futures-util = "0.3"
regex = { workspace = true }
# The KindHandler trait spawns async (a fresh registration may make
# broker calls before answering).
async-trait = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true }
weft-workspace-hack = { version = "0.1", path = "../weft-workspace-hack" }

[dev-dependencies]
weft-platform-traits = { workspace = true, features = ["test-helpers"] }
# Paused time for the waits a holder and a down signal sleep through.
tokio = { workspace = true, features = ["full", "test-util"] }
# The provider_events contract tests hold a real in-process websocket
# gateway + fake broker; the stress harness needs weft-core's
# test-support macro + futures' catch_unwind.
weft-core = { workspace = true, features = ["test-helpers"] }
futures = { workspace = true }
# The fake brokers serve the line the listener's broker clients speak.
weft-broker-client = { path = "../weft-broker-client", features = ["line-server"] }

[lints]
workspace = true
