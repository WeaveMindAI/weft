[package]
name = "weft-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lru = { workspace = true, optional = true }
# A run's firings per node, in start order and found by their frames.
indexmap = { workspace = true }
# Re-exported as the `weft_core::NodeManifest` derive: every node picks up
# its co-located metadata.json through it. Proc-macro crates build for the
# host, so the WASM parse build is unaffected.
weft-node-derive = { path = "../weft-node-derive" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
sha2 = { workspace = true }
# `from_url` resource-source patterns are validated at metadata load, so
# a typo'd extractor fails the node's metadata parse, not a later paste.
regex = { workspace = true }
fancy-regex = { workspace = true }
# URL parsing, in the pure layer too: a push recipe's jwksUrl is checked
# (`access::events::check_jwks_url`) wherever recipes load, the compiler
# included; at run time, the URL surgery of the personal-access auth
# pipeline (`access::client`).
url = { workspace = true }
# Runtime-only deps, gated behind the `runtime` feature (default on). The
# language TYPE layer (project/node/weft_type/...) that the compiler's
# parse+validate path needs does NOT use any of these, so a parse-only consumer
# (the browser WASM build) turns `runtime` off and builds without tokio/mio,
# which has no wasm32 support. Native consumers keep the default and are
# unaffected.
tokio = { workspace = true, optional = true }
# Storage-plane byte streaming: `storage::ByteStream` is a
# `futures::stream::BoxStream` of Bytes, named in the `ContextHandle`
# storage methods (a core trait), so the alias must live in core.
futures = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
cron = { workspace = true, optional = true }
# The zone a cron timer counts in, validated where the signal is written.
chrono-tz = { workspace = true, optional = true }
# Signed socket tickets (`caller_token`): a worker's door signs one for a
# browser that asks a socket route with a plain request, and whichever
# worker copy the socket reaches checks it. HMAC-SHA256 over a base64url
# payload.
hmac = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# OAuth 1.0a request signing (`access::client`): HMAC-SHA1 by spec.
sha1 = { workspace = true, optional = true }
# The readable diff a file edit records (`storage::diff`).
similar = { workspace = true, optional = true }
# Asymmetric push-verification schemes (`access::verify`): Ed25519
# (Discord's scheme) and ECDSA P-256 (SendGrid's scheme).
ed25519-dalek = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
# The connection-client capability (`ctx.open` / `ctx.client`): the HTTP
# client type named in the `ContextHandle` trait. Runtime-only (no wasm32
# support needed).
reqwest-middleware = { workspace = true, optional = true }
# The plain outbound HTTP capability (`ctx.http()`): the one shared, pooled
# client for unpaid calls, so nodes never construct their own.
reqwest = { workspace = true, optional = true }
# Byte-exact percent decoding for the node-test rig's canonical query
# keys (the URL stack's pair parser decodes lossily to UTF-8, which
# would merge distinct binary tokens), and for the RFC 5987 filename a
# `Content-Disposition` carries (`storage`, in the pure layer too).
percent-encoding = "2"
http = { version = "1", optional = true }
# Raw outbound pipes (`net`): TLS over TCP with the system's trust roots,
# for everything that holds a non-HTTP connection (the listener's raw-pipe
# engine, node code handing a connected stream to a protocol library).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# `jwt`: the token format, with ring as its crypto.
jsonwebtoken = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
# The broker's one reader of the JSON its callers send, as an axum
# extractor (`wire_shape::Json`): under `server` only.
axum = { workspace = true, optional = true }
# The workspace-wide feature union (`.config/hakari.toml`), under `runtime`
# so the parse-only shape stays free of tokio and the rest.
weft-workspace-hack = { version = "0.1", path = "../weft-workspace-hack", optional = true }

[features]
default = ["runtime"]
# The runtime layer: the run context, buses, storage streaming, caller
# connections, cancellation, timer signals, and signed routing tokens. Pulls
# tokio/futures/bytes (no wasm32 support). Default on; the WASM parse build is
# the only consumer that turns it off (it needs only the pure type layer).
runtime = [
    "dep:tokio",
    "dep:futures",
    "dep:bytes",
    "dep:cron",
    "dep:chrono-tz",
    "dep:hmac",
    "dep:base64",
    "dep:sha1",
    "dep:similar",
    "dep:ed25519-dalek",
    "dep:p256",
    "dep:reqwest-middleware",
    "dep:reqwest",
    "dep:http",
    "dep:tokio-rustls",
    "dep:rustls-native-certs",
    "dep:lru",
    "dep:weft-workspace-hack",
]
# The broker: the JSON and query extractors of `wire_shape`.
server = ["runtime", "dep:axum"]
# Signing and checking JSON Web Tokens (`jwt`), on ring: the services that
# mint or verify one turn it on, so a worker never builds it.
jwt = ["runtime", "dep:jsonwebtoken", "dep:ring"]
# Ships the hand-rolled fakes colocated with their traits (currently
# `caller::FakeCallerConnection`) so downstream crates can wire them into
# layer-3 tests. Off by default; consumers enable it in `[dev-dependencies]`.
test-helpers = []

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
