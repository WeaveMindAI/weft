[package]
name = "weft-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Re-exported as the `weft_core::NodeManifest` derive: every node picks up
# its co-located metadata.json through it. Proc-macro crates build for the
# host, so the WASM parse build is unaffected.
weft-node-derive = { path = "../weft-node-derive" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
sha2 = { workspace = true }
# `from_url` resource-source patterns are validated at metadata load, so
# a typo'd extractor fails the node's metadata parse, not a later paste.
regex = { workspace = true }
# Runtime-only deps, gated behind the `runtime` feature (default on). The
# language TYPE layer (project/node/weft_type/...) that the compiler's
# parse+validate path needs does NOT use any of these, so a parse-only consumer
# (the browser WASM build) turns `runtime` off and builds without tokio/mio,
# which has no wasm32 support. Native consumers keep the default and are
# unaffected.
tokio = { workspace = true, optional = true }
# Storage-plane byte streaming: `storage::ByteStream` is a
# `futures::stream::BoxStream` of Bytes, named in the `ContextHandle`
# storage methods (a core trait), so the alias must live in core.
futures = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
cron = { version = "0.12", optional = true }
# Signed routing-token mint/verify (`caller_token`): the dispatcher signs
# a (color, project, pod) token at the control handshake; the worker
# verifies it before accepting a live connection. HMAC-SHA256 over a
# base64url payload.
hmac = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# OAuth 1.0a request signing (`access::client`): HMAC-SHA1 by spec.
sha1 = { workspace = true, optional = true }
# Asymmetric push-verification schemes (`access::verify`): Ed25519
# (Discord's scheme) and ECDSA P-256 (SendGrid's scheme).
ed25519-dalek = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
# The connection-client capability (`ctx.open` / `ctx.client`): the HTTP
# client type named in the `ContextHandle` trait. Runtime-only (no wasm32
# support needed).
reqwest-middleware = { workspace = true, optional = true }
# The plain outbound HTTP capability (`ctx.http()`): the one shared, pooled
# client for unpaid calls, so nodes never construct their own.
reqwest = { workspace = true, optional = true }
# The personal-access auth pipeline (`access::client`): URL surgery for
# query/path transforms, and the middleware's Extensions type.
url = { workspace = true, optional = true }
# Byte-exact percent decoding for the node-test rig's canonical query
# keys (the URL stack's pair parser decodes lossily to UTF-8, which
# would merge distinct binary tokens).
percent-encoding = { version = "2", optional = true }
http = { version = "1", optional = true }
# Raw outbound pipes (`net`): TLS over TCP with the system's trust roots,
# for everything that holds a non-HTTP connection (the listener's raw-pipe
# engine, node code handing a connected stream to a protocol library).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[features]
default = ["runtime"]
# The runtime layer: the execution context, buses, storage streaming, caller
# connections, cancellation, timer signals, and signed routing tokens. Pulls
# tokio/futures/bytes (no wasm32 support). Default on; the WASM parse build is
# the only consumer that turns it off (it needs only the pure type layer).
runtime = [
    "dep:tokio",
    "dep:futures",
    "dep:bytes",
    "dep:cron",
    "dep:hmac",
    "dep:base64",
    "dep:sha1",
    "dep:ed25519-dalek",
    "dep:p256",
    "dep:reqwest-middleware",
    "dep:reqwest",
    "dep:url",
    "dep:percent-encoding",
    "dep:http",
    "dep:tokio-rustls",
    "dep:rustls-native-certs",
]
# Ships the hand-rolled fakes colocated with their traits (currently
# `caller::FakeCallerConnection`) so downstream crates can wire them into
# layer-3 tests. Off by default; consumers enable it in `[dev-dependencies]`.
test-helpers = []

[lints]
workspace = true
