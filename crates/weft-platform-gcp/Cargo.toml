[package]
name = "weft-platform-gcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The Google Cloud implementation of the translation layer's traits
# (`weft-platform-traits`). The `metadata` module (a process's own
# identity, from the metadata server) is all a worker links; everything
# that drives Google's APIs is behind `control`, which only the runtime
# enables.

[features]
default = []
control = [
    "dep:jsonwebtoken",
    "dep:sqlx",
    "dep:tar",
    "dep:flate2",
    "dep:base64",
    "dep:sha2",
    "dep:tracing",
    "dep:chrono",
    "dep:bytes",
]

[dependencies]
weft-platform-traits = { workspace = true }
weft-core = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The host agent's log query (`LogsFrom`, as JSON in the query string).
url = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
jsonwebtoken = { workspace = true, optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"], optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
