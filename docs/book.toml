[book]
title = "The Weft Book"
description = "The language, the node framework, and the runtime."
authors = ["Quentin Feuillade--Montixi"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/WeaveMindAI/weft"
edit-url-template = "https://github.com/WeaveMindAI/weft/edit/mvp/docs/{path}"
site-url = "/weft/"
no-section-label = true
additional-css = ["theme/weft.css"]
additional-js = ["theme/highlight-weft.js", "theme/inline-code.js", "theme/copy-markdown.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2

[output.html.playground]
runnable = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.copy-markdown]
command = "python3 theme/copy_markdown.py"
before = ["mermaid"]

[output.html.print]
enable = true
