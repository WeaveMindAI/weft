[workspace]
resolver = "2"
members = [
    "crates/weft-core",
    "crates/weft-node-derive",
    "crates/weft-compiler",
    "crates/weft-dispatcher",
    "crates/weft-cli",
    "crates/weft-engine",
    "crates/weft-catalog",
    "crates/weft-journal",
    "crates/weft-listener",
    "crates/weft-task-store",
    "crates/weft-access-store",
    "crates/weft-broker",
    "crates/weft-broker-client",
    "crates/weft-infra-supervisor",
    "crates/weft-platform-traits",
    "crates/weft-platform-local",
    "crates/weft-platform-gcp",
    "crates/weft-runtime",
    "crates/weft-assets",
    "crates/weft-providers",
    "crates/weft-e2e",
]

[workspace.lints.clippy]
# CI runs clippy with -D warnings, so what is allowed is POLICY and it
# lives here, once. Doc comments in this workspace are long-form prose;
# clippy's list-indentation opinions fight that style constantly and
# carry no bug signal. The workspace's orchestration entry points and
# store/client traits deliberately take their full context as named
# parameters rather than a grab-bag struct, so the argument-count lint
# is also policy, not drift.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
too_many_arguments = "allow"
# An HTTP handler's refusal is the response itself (axum's `Response`, 128
# bytes), returned as the `Err` of the helpers that build it: boxing every
# refusal to please the size lint buys nothing on a path that answers a
# request.
result_large_err = "allow"

# Dev/test binaries carry line tables only, not full variable
# debuginfo. This workspace's test binaries are enormous with full
# debuginfo (target/debug alone once grew past 25GB: every crate's
# test binary re-embeds the whole dependency graph's debuginfo), and
# the everyday loop (cargo test, backtraces, logs) never reads
# variable values out of a debugger; line tables keep every backtrace
# line-accurate. A step-debugging session opts back in per invocation
# (RUSTFLAGS="-C debuginfo=2" cargo test ...; expect a cold rebuild
# and big binaries while it is set).
[profile.dev]
debug = "line-tables-only"

# The runtime (`deploy/docker/runtime.Dockerfile`, and the host binary
# `setup.sh` installs) and the CLI build `--release`, locally after every
# runtime edit. By default a
# release build recompiles each edited crate, and everything depending on
# it, whole: a one-line change to weft-core took about 80 seconds.
# Incremental builds with many codegen units recompile only what the edit
# touched, and the image's cache mount keeps that state between builds.
# The cost is a slightly slower binary than 16 units would give, which
# none of these binaries notice.
[profile.release]
incremental = true
codegen-units = 256

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "LicenseRef-OSAASy"
repository = "https://github.com/WeaveMindAI/weft"

[workspace.dependencies]
# JWT signing (access-store's MintJwt) and verification (the broker's
# caller auth). Version 10 carries no crypto of its own: without a backend
# feature its first sign or verify panics at run time, so the backend is
# chosen once, here, for every crate.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
# async + runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# http
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# The injectable-client seam for metered paid calls: `ctx.metered_client`
# returns a `ClientWithMiddleware`, the ecosystem-standard way to hand a
# library an HTTP client with behavior layered behind it.
reqwest-middleware = { version = "0.4", features = ["json"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# S3-compatible object storage (the ObjectStore slot: GCS / SeaweedFS / AWS /
# any S3 endpoint via an endpoint-URL override). rustls so we don't drag in
# a native TLS toolchain, matching reqwest above.
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "sigv4a"] }
# The AWS SDK's HTTPS client, on `ring` like every other TLS client here.
# The SDK's own `rustls` feature picks `aws-lc-rs`, a second crypto library
# that compiles a whole C library with cmake on every cold build; the client
# is handed to the SDK instead (`weft_platform_traits::object_store`).
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-smithy-types = "1"

# serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
# Editing a committed weft.toml in place, comments and order kept
# (`weft target add`).
toml_edit = "0.22"
# A build context uploaded for Cloud Build as one gzipped tarball
# (weft-platform-gcp `images`).
tar = "0.4"
flate2 = "1"
# A run's record, compressed by whoever writes it (`weft_journal::stored`):
# a ping's events are about 2 KB of JSON, which Postgres leaves as it is.
zstd = "0.13"

# lossless concrete syntax tree (the .weft CST: parse, edit, byte-exact round-trip)
rowan = "0.16"

# cli
clap = { version = "4", features = ["derive", "env"] }
# Tab completion: the shell asks the `weft` binary itself for candidates.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }

# errors
thiserror = "2"
anyhow = "1"

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# utils
uuid = { version = "1", features = ["v4", "v5", "v7", "fast-rng", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# IANA time zones, for a cron schedule that means "nine in Paris".
chrono-tz = "0.10"
bytes = "1"
# Socket options the standard library does not expose. Used for
# TCP_USER_TIMEOUT on accepted live-caller connections, which is what
# bounds a caller who vanished without saying so.
socket2 = "0.6"
regex = "1"
inventory = "0.3"
url = "2"
# Hidden-echo terminal input for pasted credentials (`weft connect`).
rpassword = "7"
# Open the browser on the OAuth consent URL (`weft connect`).
open = "5"
terminal_size = "0.4"
hmac = "0.12"
aes-gcm = "0.10"
sha2 = "0.10"
# OAuth 1.0a request signing (an AuthStep Sign kind) is HMAC-SHA1 by spec.
sha1 = "0.10"
# The readable line diff a file edit records for the inspector.
similar = "2"
# Asymmetric push-verification schemes (access::verify::VerifyKind::Signature):
# Ed25519 (Discord's scheme) and ECDSA P-256 (SendGrid's scheme).
ed25519-dalek = "2"
p256 = "0.13"
tempfile = "3"
parking_lot = "0.12"
filetime = "0.2"
base64 = "0.22"
# The project worker's allocator (`weft_engine::Jemalloc`, declared by the
# generated worker `main`): glibc's kept a burst's freed memory for good,
# so a worker past one read as full while idle. Background threads purge
# what was freed even while nothing allocates (an idle worker), the way
# Restate's server runs it.
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }
# The worker's own CPU profile (`weft_engine::profile`, `WEFT_PROFILE`):
# sampled with signals, so a machine without `perf` profiles too.
pprof = { version = "0.15", features = ["flamegraph"] }

# internal workspace crates
weft-core = { path = "crates/weft-core" }
weft-compiler = { path = "crates/weft-compiler" }
weft-engine = { path = "crates/weft-engine" }
weft-catalog = { path = "crates/weft-catalog" }
weft-journal = { path = "crates/weft-journal" }
weft-task-store = { path = "crates/weft-task-store" }
weft-access-store = { path = "crates/weft-access-store" }
weft-platform-traits = { path = "crates/weft-platform-traits" }
weft-platform-local = { path = "crates/weft-platform-local" }
weft-platform-gcp = { path = "crates/weft-platform-gcp" }
weft-assets = { path = "crates/weft-assets" }
weft-providers = { path = "crates/weft-providers" }
