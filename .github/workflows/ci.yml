# The checks CONTRIBUTING asks you to run locally, run again on every PR.
#
# Deliberately NOT here: the end-to-end suite (needs a real cluster, driven by
# scripts/run-e2e.sh) and the live node-test tier (spends real money). Both are
# run by hand before a release.
name: ci

on:
  pull_request:
    # Into mvp only: main carries the old POC this suite was never
    # written for.
    branches: [mvp]
  workflow_dispatch:
  # release.yml runs this as its gate on every mvp push, so nothing
  # (images, binaries, store uploads) publishes from a commit that
  # fails the checks. There is deliberately no `push` trigger: mvp
  # pushes get their run through the call (a second trigger would
  # double it), PRs into mvp get theirs through `pull_request`, and
  # main carries the old POC this suite was never written for.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

# The workflow name is in the group: a called run (release.yml's gate)
# reports the CALLER's workflow, so a manual `ci` dispatch on the same
# ref lands in a different group instead of cancelling a release's
# gate mid-flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-proxy:
    name: public proxy routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/tests/test_public_proxy.py

  rust:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bare `rustup toolchain install` reads rust-toolchain.toml, the
      # single source of truth for the version AND the components
      # (clippy for the gate below). No third-party toolchain action:
      # pinned to a commit it demands an explicit toolchain input,
      # which would fork the version out of the toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # No compile-time query macros anywhere, so the workspace suite needs no
      # database. The tests that do want one are behind the `db-tests` feature.
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The examples are the first thing a new user copies, and nothing
      # else compiles them. The script tolerates only the
      # connect-a-credential diagnostics a fresh checkout produces.
      - run: scripts/validate-examples.sh

  db:
    name: cargo test --features db-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (see the rust job's comment).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The same script developers run locally, pointed at the service
      # container, so the crate list lives in exactly one place.
      - run: scripts/run-db-tests.sh

  editor:
    name: graph + editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-vscode
          borrow-packages: packages/weft-graph packages/weft-syntax
      - run: pnpm -C packages/weft-graph test
      - run: pnpm -C packages/weft-syntax test
      - run: pnpm -C extension-vscode test
      - run: pnpm -C extension-vscode run compile
      # The browser extension ships to three stores gated only on a
      # version bump, so its checks belong in the same gate as
      # everything else JS.
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-browser
      - run: pnpm -C extension-browser exec tsc --noEmit
      - run: pnpm -C extension-browser check
