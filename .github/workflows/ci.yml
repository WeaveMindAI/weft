# The checks CONTRIBUTING asks you to run locally, run again on every PR.
#
# Deliberately NOT here: the end-to-end suite (needs a local weft install and
# Docker, driven by scripts/run-e2e.sh) and the live node-test tier (spends real money). Both are
# run by hand before a release.
name: ci

on:
  pull_request:
    # Into main only: `poc` (the retired proof of concept) carries
    # code this suite was never written for.
    branches: [main]
  workflow_dispatch:
  # release.yml runs this as its gate on every main push, so nothing
  # (images, binaries, store uploads) publishes from a commit that
  # fails the checks. There is deliberately no `push` trigger: main
  # pushes get their run through the call (a second trigger would
  # double it), and PRs into main get theirs through `pull_request`.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # The cargo-nextest the test jobs download, prebuilt, from the project's
  # own install script. scripts/check-pins.sh reads it from here.
  NEXTEST_VERSION: 0.9.150

# Read-only token for every job: nothing here writes to the repo.
permissions:
  contents: read

# The workflow name is in the group: a called run (release.yml's gate)
# reports the CALLER's workflow, so a manual `ci` dispatch on the same
# ref lands in a different group instead of cancelling a release's
# gate mid-flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The stores publish a version once (the record tags in release.yml),
  # so an extension change merged under a version the stores already
  # carry never reaches them. PRs only: a called run on a main push has
  # no base to compare against, and by then the merge has happened.
  bump:
    name: extension versions bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/check-extension-bump.sh "origin/${{ github.base_ref }}"

  # The Rust checks, each on its own runner so they run side by side:
  # the wall time is the slowest one instead of their sum. Each builds
  # what it needs from the tests job's cache (`shared-key`), which only
  # that job saves, on main: one warm copy in the repo's cache space
  # instead of one per job. The `rust` job below gathers them under the
  # one name the main ruleset requires.
  test:
    name: cargo nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bare `rustup toolchain install` reads rust-toolchain.toml, the
      # single source of truth for the version AND the components
      # (clippy for the gate below). No third-party toolchain action:
      # pinned to a commit it demands an explicit toolchain input,
      # which would fork the version out of the toml.
      - run: rustup toolchain install
      # Restores everywhere, saves only on main (release.yml's call of
      # this file): a PR reads main's copy and leaves nothing behind, and
      # release.yml's prune-caches keeps one copy per cache. It saves even
      # when a test fails: the compiled build is just as good, and without
      # it every run after a red main starts from nothing again.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # No compile-time query macros anywhere, so the workspace suite needs no
      # database. The tests that do want one compile here too, and nextest's
      # default profile leaves them out (`.config/nextest.toml`); the `db`
      # job below runs them.
      # Under cargo-nextest, as developers run it: each test in its own
      # process, which tests that set the process's env vars rely on.
      - run: curl -LsSf "https://get.nexte.st/${NEXTEST_VERSION}/linux" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: cargo nextest run --workspace --locked

  doc:
    name: cargo doc tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace
          save-if: false
      # Doc tests are the one kind nextest does not run.
      - run: cargo test --workspace --locked --doc

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace
          save-if: false
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  parse-only:
    name: parse-only build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace
          save-if: false
      # The parse-only build (weft-core without its `runtime` layer, what a
      # WASM parser links). A workspace build always turns `runtime` on, so
      # nothing else compiles this shape.
      - run: cargo check -p weft-compiler --no-default-features --locked

  examples:
    name: examples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace
          save-if: false
      # The examples are the first thing a new user copies, and nothing
      # else compiles them. The script tolerates only the
      # connect-a-credential diagnostics a fresh checkout produces.
      - run: scripts/validate-examples.sh

  # `crates/weft-workspace-hack` (`.config/hakari.toml`) must match the
  # workspace's dependencies, and every member must depend on it, or narrow
  # builds go back to compiling their own copy of each dependency.
  workspace-hack:
    name: workspace-hack up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo install cargo-hakari --version 0.9.39 --locked
      - run: cargo hakari generate --diff
      - run: cargo hakari manage-deps --dry-run
      - run: cargo hakari verify

  # The install's Terraform, checked against the provider versions it
  # allows: an argument the provider does not know fails here instead of
  # in every install. No backend and no credentials: validate reads only
  # the files and the provider's schema.
  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - working-directory: deploy/terraform/gcp
        run: |
          terraform init -backend=false -input=false
          terraform validate
      # What the install workflow's targeted applies add for every
      # `moved` block, read from the files above.
      - run: scripts/terraform-moved-targets.test.sh
      # Where a deploy finds its CLI: the install, then weft's release,
      # then a build, with a fake web standing in for both.
      - run: scripts/release-cli.test.sh

  # The name the main ruleset requires: green only when every Rust check
  # above is, and the Terraform the install runs validates. It runs whatever happened above (unless the run was
  # cancelled), so a failure there shows here as a failure, never as a
  # skip the ruleset would wait on.
  rust:
    name: cargo test + clippy
    needs: [test, doc, clippy, parse-only, examples, workspace-hack, terraform]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" >/dev/null \
            || { jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"; exit 1; }

  # The job's name is one the main ruleset requires, so it stays as it is
  # although the tests are now picked by nextest's `db` profile, not by a
  # cargo feature.
  db:
    name: cargo test --features db-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml (see the rust job's comment).
      - run: rustup toolchain install
      # Saves only on main, even after a failed test, like the rust job's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The script runs the suites under cargo-nextest (every test side by
      # side), the version NEXTEST_VERSION names at the top of this file.
      - run: curl -LsSf "https://get.nexte.st/${NEXTEST_VERSION}/linux" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      # The same script developers run locally, pointed at the service
      # container, so the crate list lives in exactly one place.
      - run: scripts/run-db-tests.sh

  # The JS checks, side by side like the Rust ones, gathered under the
  # name the main ruleset requires by the `editor` job below.
  graph:
    name: weft-graph tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-vscode
          borrow-packages: packages/weft-graph packages/weft-syntax packages/weft-connect
      - run: pnpm -C packages/weft-graph test

  connect:
    name: weft-connect tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-vscode
          borrow-packages: packages/weft-graph packages/weft-syntax packages/weft-connect
      - run: pnpm -C packages/weft-connect test

  syntax:
    name: weft-syntax tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-vscode
          borrow-packages: packages/weft-graph packages/weft-syntax packages/weft-connect
      - run: pnpm -C packages/weft-syntax test

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-vscode
          borrow-packages: packages/weft-graph packages/weft-syntax packages/weft-connect
      - run: pnpm -C extension-vscode test
      - run: pnpm -C extension-vscode run compile
      # The production webview bundle, as the release packages it: a PR that
      # only type-checks the webview let a bundle that cannot build reach
      # main and stop a release (0.2.285).
      - run: pnpm -C extension-vscode run bundle:webview

  bridge:
    name: WhatsApp bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The bridge's pure parts; `node --test` needs no install.
      - run: node --test catalog/bailey/bridge/images/bridge/src/*.test.js

  postgres-credential:
    name: Postgres credential container tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The container's pure parts, on the standard library alone.
      - run: python3 catalog/postgres/database/images/credential/test_bootstrap.py

  # The Tangle plugins and hooks that decide what a specialist may run:
  # Kilo Code's and OpenCode's tests are TypeScript run straight by
  # `node`, which strips the types itself from Node 22.18 on, and Claude
  # Code's and Codex's are Python on the standard library, so none of
  # them needs an install.
  tangle:
    name: Tangle plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tangle/kilo-code/tests/*.test.ts
      - run: node tangle/opencode/tests/specialist-commands.test.ts
      - run: python3 tangle/claude-code/tests/test_specialist_commands.py
      - run: python3 tangle/codex/tests/test_specialist_commands.py

  # The browser extension ships to three stores gated only on a version
  # bump, so its checks belong in the same gate as everything else JS.
  browser:
    name: browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # svelte-check reads the connect library's own sources and its
      # svelte.config, whose packages live in the editor's workspace:
      # the library borrows that install, as it does locally.
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-vscode
          borrow-packages: packages/weft-connect
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-browser
      - run: pnpm -C extension-browser exec tsc --noEmit
      - run: pnpm -C extension-browser check

  # The name the main ruleset requires (see the `rust` job).
  editor:
    name: graph + editor
    needs: [graph, connect, syntax, vscode, bridge, postgres-credential, tangle, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" >/dev/null \
            || { jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"; exit 1; }
