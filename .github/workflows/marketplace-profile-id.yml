# One-off: print the Azure managed identity's internal Marketplace
# profile id. The VS Code Marketplace only accepts that id when adding
# the identity as a member of the publisher, and only the identity
# itself can look it up, so this runs once in CI and the id gets pasted
# into marketplace.visualstudio.com/manage -> weavemind -> Members
# (role: Contributor). DELETE THIS FILE after that: a dispatch-able
# workflow on an OIDC-bearing environment is a standing credential
# path (a rewritten copy on a side branch could mint the publish
# token unless the environment's deployment-branch policy is pinned
# to mvp, which it must be regardless).
name: marketplace-profile-id

on:
  workflow_dispatch:

jobs:
  profile-id:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # 499b84ac-...: Azure DevOps' resource id; the call makes the
      # identity known to the profile service and returns its id.
      - name: print the profile id
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798
