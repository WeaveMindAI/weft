# Publish everything a `./setup.sh` can consume, on every push to the release
# branch:
#
#   - the runtime image and the worker builder base, pushed to ghcr under
#     their content-addressed tags (the SAME tags a local install computes, so
#     a clean checkout pulls instead of compiling; any local edit changes the
#     hash and builds locally), one native build per architecture stitched
#     into a multi-arch tag,
#   - CLI and runtime binaries and the .vsix, attached to the rolling `latest`
#     release with a manifest.json naming the exact commit and a sha256 per
#     asset (setup.sh downloads them when its checkout matches); the browser
#     zips ride along as the record of what went to the stores and for
#     sideloading the targets that have no store (Opera, Safari),
#   - the extension stores (VS Code Marketplace, Open VSX, Chrome, Firefox,
#     Edge), but ONLY when the extension's version moved: a per-store
#     `*-v<version>` tag records each successful publish, so bumping the
#     version (setup.sh --bump) is the whole release gesture, ordinary
#     pushes never spam store reviews, and one store failing retries alone
#     on the next push.
#
# Third-party actions are pinned to commit SHAs: this pipeline pushes
# images users pull and binaries users execute against shas it computes
# itself, so a mutable action tag is a supply-chain door.
name: release

on:
  push:
    branches: [main]

# One release at a time, NEVER cancelled mid-flight: a store publish
# killed between "uploaded to the store" and "recorded the version tag"
# would retry a version the store already has and stay red forever.
# A newer push queues; intermediate pending runs are superseded.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# The floor; every job that needs more (packages, releases, id-token)
# raises its own.
permissions:
  contents: read

jobs:
  # ---- the gate --------------------------------------------------------
  #
  # The full CI suite (tests, clippy, schema agreement, editor checks)
  # runs and every publishing job below waits on it. What only builds
  # (the binaries, the .vsix, the browser zips) starts at once beside it,
  # so the slow compiles overlap the checks; nothing it makes leaves the
  # run's own artifacts until the gate is green. A commit that fails the
  # checks publishes NOTHING: no images, no binaries, no store uploads. Whoever pulls such a commit builds from source and
  # hits the same loud local failure the dev did; their data is safe
  # either way (the boot refuses on schema drift instead of guessing).
  #
  # Only on weft's own repository: a fork that turns its workflows on (to
  # run "install on GCP") must never publish images, binaries or store
  # versions. Every job below waits on this one, so skipping it skips
  # the whole release.
  ci:
    if: github.repository == 'WeaveMindAI/weft'
    uses: ./.github/workflows/ci.yml

  # ---- Linux binaries, and the shared images -> ghcr ------------------
  #
  # Each leg builds the CLI and the runtime for its architecture, then the
  # shared images, on its NATIVE runner (no qemu), pushing `<ref>-<arch>`;
  # images-manifest then publishes the bare `<ref>` as a multi-arch
  # manifest list, so an Apple-silicon / ARM machine pulls arm64 and an
  # x86 machine pulls amd64 from the same content-addressed tag. The tag
  # hashes source content only, so both legs compute the identical ref
  # (the stitch job verifies it).
  #
  # The runtime image takes the `weft-runtime` its leg just built, so the
  # image carries the very binary the release ships and nothing compiles
  # it a second time inside Docker. That works because these legs run on
  # Ubuntu 22.04, whose glibc is older than the image's Debian bookworm
  # (`weft build-images` starts the binary in the image to make sure).
  linux-binaries:
    name: ${{ matrix.asset }}
    if: github.repository == 'WeaveMindAI/weft'
    strategy:
      # One architecture failing must not kill the other's build
      # mid-way; the stitch below requires both, so nothing partial is
      # ever published either way.
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: oldest supported runner glibc, so the binary
          # runs on every distro at least that new, and in the image.
          # SYNC: CLI asset names <-> setup.sh (prebuilt artifacts
          #       block: the uname case), the macos job's matrix, the linux job's matrix
          - { runner: ubuntu-22.04, asset: weft-x86_64-linux, arch: amd64 }
          - { runner: ubuntu-22.04-arm, asset: weft-aarch64-linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-binaries
        with:
          asset: ${{ matrix.asset }}

  # The images push to ghcr, so they wait on the gate; the binaries they
  # carry come from the leg above.
  linux:
    name: ${{ matrix.asset }} images
    needs: [ci, linux-binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          # SYNC: the matrix <-> the linux-binaries job's matrix
          - { runner: ubuntu-22.04, asset: weft-x86_64-linux, runtime: weft-runtime-x86_64-linux, arch: amd64 }
          - { runner: ubuntu-22.04-arm, asset: weft-aarch64-linux, runtime: weft-runtime-aarch64-linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The builder base alone is >1GB and the builds run through
      # BuildKit on this disk; the preinstalled Android/.NET/GHC
      # toolchains are dead weight here.
      - name: free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: ${{ runner.temp }}/bin
      # Outside the checkout: the image refs hash the source tree, and the
      # two legs' binaries differ.
      - run: chmod +x "$RUNNER_TEMP"/bin/*
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ensure = present -> pull -> build against THIS ARCH'S half
      # (`<ref>-<arch>`), never the bare ref: a bare ref that predates
      # multi-arch could satisfy the wrong architecture's leg and then
      # be re-pushed as its half. Stdout is the bare refs, captured for
      # the stitch job.
      # SYNC: `weft build-images` stdout <-> crates/weft-cli/src/images.rs (SharedImages::bare_refs), .github/workflows/install-gcp.yml (build the runtime's images)
      - name: build + push shared images
        run: |
          "$RUNNER_TEMP/bin/${{ matrix.asset }}" build-images \
            --push-suffix "-${{ matrix.arch }}" \
            --runtime-binary "$RUNNER_TEMP/bin/${{ matrix.runtime }}" > image-refs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-refs-${{ matrix.arch }}
          path: image-refs.txt
          if-no-files-found: error

  # ---- macOS binaries --------------------------------------------------
  #
  # Their own job, so nothing waits on them: the latest release goes out
  # with the Linux binaries and the images, and release-macos adds these
  # once they are built. The Intel runner is the slowest machine in the
  # whole release by far.
  macos:
    name: ${{ matrix.asset }}
    if: github.repository == 'WeaveMindAI/weft'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is arm64 (Apple silicon); macos-15-intel is
          # the x86_64 runner GitHub keeps until August 2027.
          # SYNC: CLI asset names <-> setup.sh (prebuilt artifacts
          #       block: the uname case), the linux job's matrix
          - { runner: macos-latest, asset: weft-aarch64-macos }
          - { runner: macos-15-intel, asset: weft-x86_64-macos }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-binaries
        with:
          asset: ${{ matrix.asset }}

  # The bare `<ref>` becomes a multi-arch manifest list over the two
  # halves the linux job pushed.
  images-manifest:
    name: publish multi-arch image tags
    runs-on: ubuntu-latest
    needs: [linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-refs-amd64
          path: refs-amd64
      - uses: actions/download-artifact@v4
        with:
          name: image-refs-arm64
          path: refs-arm64
      # Both legs computing identical refs is the assumption the stitch
      # rests on; a divergence (an env override or an untracked file
      # differing between runners) must be a named failure, not an
      # orphaned half-push.
      - name: the two legs must agree on the refs
        run: |
          diff refs-amd64/image-refs.txt refs-arm64/image-refs.txt || {
            echo "::error::the two architecture legs computed different image refs; both halves are already pushed (orphaned suffixed tags, the bare refs stay absent so users fall back to building). Check for a WEFT_IMAGE_REGISTRY or WEFT_*_IMAGE override differing between runners."
            exit 1
          }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The bare ref becomes a manifest list pointing at both halves.
      # Until this runs, the bare ref does not exist (or still names the
      # previous content), so a half-pushed set is never picked up.
      - name: stitch manifest lists
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            docker buildx imagetools create -t "$ref" "$ref-amd64" "$ref-arm64"
          done < refs-amd64/image-refs.txt
      # The whole point of publishing is that a user's docker can pull
      # WITHOUT credentials; a ghcr package that is still private (they
      # are born private on first push) degrades every install to a
      # silent full compile. Fail here, loudly, with the fix.
      - name: the published refs must be pullable anonymously
        run: |
          set -euo pipefail
          docker logout ghcr.io
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            docker manifest inspect "$ref" >/dev/null \
              || { echo "::error::$ref is not anonymously pullable; open github.com/orgs/WeaveMindAI/packages and flip this package to Public"; exit 1; }
          done < refs-amd64/image-refs.txt

  # ---- build caches ----------------------------------------------------
  #
  # Only main saves Rust build caches (ci.yml's jobs skip saving on a
  # PR), and each save is keyed by the Cargo.lock and toolchain it was
  # built with, so a dependency bump leaves the previous copy behind next
  # to the new one. Once every job that saves one has finished, each
  # cache keeps its newest copy and the rest are deleted, so the repo's
  # cache space holds one warm copy per job and platform. A cache no job
  # saves any more goes on its own after seven days unused.
  prune-caches:
    name: keep one copy of each build cache
    needs: [ci, linux-binaries, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A rust-cache key ends in two 8-hex segments (the toolchain and
      # environment, then the lockfile); what is left before them names
      # the job and platform, the thing that should exist only once.
      - name: drop superseded copies
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key v0-rust- \
              --limit 1000 --json id,key,createdAt \
            | jq -r 'group_by(.key | sub("-[0-9a-f]{8}-[0-9a-f]{8}$"; ""))
                     | map(sort_by(.createdAt) | reverse | .[1:][]) | .[] | "\(.id) \(.key)"' \
            | while read -r id key; do
                echo "dropping $key (a newer copy replaced it)"
                gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
              done

  # ---- VS Code extension ----------------------------------------------
  vsix:
    name: package .vsix
    if: github.repository == 'WeaveMindAI/weft'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tags.outputs.version }}
      pending: ${{ steps.tags.outputs.pending }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-vscode
          borrow-packages: packages/weft-graph packages/weft-syntax packages/weft-connect
      - run: pnpm -C extension-vscode run compile
      - run: pnpm -C extension-vscode run bundle:webview
      - run: pnpm -C extension-vscode run bundle:markdown-preview
      # The repo LICENSE rides inside the .vsix (both stores refuse a
      # licenseless extension); copied, not tracked twice.
      - run: cp LICENSE extension-vscode/LICENSE
      # working-directory, not `pnpm -C`: dlx spawns the tool in the
      # PROCESS cwd, so with -C vsce would look for package.json at the
      # repo root and refuse.
      - run: pnpm dlx @vscode/vsce@3.9.2 package --no-dependencies
        working-directory: extension-vscode
      # One stable asset name; the version lives in manifest.json and
      # in the package itself.
      # SYNC: vsix asset name <-> setup.sh (prebuilt artifacts block:
      #       the weft-vscode.vsix download)
      - run: mv extension-vscode/weft-vscode-*.vsix weft-vscode.vsix
      - id: tags
        uses: ./.github/actions/store-publish-state
        with:
          workspace: extension-vscode
          tag-prefix: vscode
          stores: marketplace openvsx
      - uses: actions/upload-artifact@v4
        with:
          name: weft-vscode.vsix
          path: weft-vscode.vsix
          if-no-files-found: error

  # ---- browser extension ----------------------------------------------
  browser:
    name: package browser zips
    if: github.repository == 'WeaveMindAI/weft'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tags.outputs.version }}
      pending: ${{ steps.tags.outputs.pending }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-browser
      # zip:firefox also writes weft-extension-sources.zip (AMO reviews
      # the source of bundled output).
      - run: pnpm -C extension-browser zip
      - run: pnpm -C extension-browser zip:firefox
      - run: pnpm -C extension-browser zip:edge
      - run: pnpm -C extension-browser zip:opera
      - run: pnpm -C extension-browser zip:safari
      - id: tags
        uses: ./.github/actions/store-publish-state
        with:
          workspace: extension-browser
          tag-prefix: browser
          stores: chrome firefox edge
      - uses: actions/upload-artifact@v4
        with:
          name: browser-zips
          path: extension-browser/build/*.zip
          if-no-files-found: error

  # ---- rolling release -------------------------------------------------
  release:
    name: update latest release
    runs-on: ubuntu-latest
    needs: [ci, linux, vsix, browser, images-manifest]
    # Runs even when the browser packaging failed (one unbuildable
    # artifact must not strand every other's assets), but never without
    # the vsix job (it supplies the version the manifest needs) and never
    # without the stitched images (which also means both Linux binaries
    # built): manifest.json is
    # the "prebuilts for this commit are ready" signal setup.sh keys
    # on, and publishing it while no image is pullable would hand a
    # toolchain-less user a prebuilt CLI whose first `daemon start`
    # falls back to a multi-GB local docker build.
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.vsix.result == 'success' && needs['images-manifest'].result == 'success' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # Exactly the release payload, by name: the image-refs artifacts
      # (internal plumbing for the stitch job) must never leak into the
      # public asset list. The macOS binaries are release-macos's, even
      # when one happens to be built already, so what this job publishes
      # never depends on which runner was faster.
      - uses: actions/download-artifact@v4
        with:
          pattern: weft-*-linux
          path: dist
          merge-multiple: true
      # A pattern, so a failed browser job just means fewer files (the
      # manifest then carries no sha for them, which setup-side reads
      # as "not published"): `name:` would fail the whole job instead.
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-zips
          path: dist
          merge-multiple: true
      - name: assemble + upload
        env:
          # Repo-derived values reach the script as env vars, never by
          # interpolation into the body (interpolated text executes).
          VSCODE_VERSION: ${{ needs.vsix.outputs.version }}
        run: |
          set -euo pipefail
          # SYNC: the latest release tag <-> setup.sh (prebuilt
          #       artifacts block: the release download URLs)
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --target "${GITHUB_SHA}" --prerelease --title "Rolling build (main)" \
            --notes "Assets from the latest push to main; manifest.json names the commit. setup.sh consumes these."
          # Keep the release's tag on the commit the assets came from,
          # or its "Source code" links would forever show the first
          # build's tree.
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin refs/tags/latest
          # `--clobber` deletes each existing asset and re-uploads it
          # (that is gh's documented mechanism), so every asset has a
          # short per-asset 404 window instead of one long all-assets
          # gap. Safe in both directions: a 404 fails setup.sh's
          # `curl -fsSL` (which falls back to building), a
          # half-replaced asset fails its sha256 compare, and a
          # missing manifest reads as "nothing published". The
          # manifest goes LAST so its commit stamp never vouches for
          # assets that are not up yet.
          # SYNC: manifest.json keys <-> setup.sh (prebuilt artifacts block: manifest_value), scripts/release-cli.sh, the release-macos job
          gh release upload latest dist/* --clobber
          # `tree` names the source content: a fork that merged this
          # commit into an unchanged copy has another commit but the same
          # tree, and the same binaries are right for it.
          {
            printf '{\n  "commit": "%s",\n' "${GITHUB_SHA}"
            printf '  "tree": "%s",\n' "$(git rev-parse "${GITHUB_SHA}^{tree}")"
            printf '  "vscode_version": "%s",\n' "${VSCODE_VERSION}"
            for f in dist/*; do
              printf '  "sha256_%s": "%s",\n' "$(basename "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            printf '  "built_at": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > manifest.json
          gh release upload latest manifest.json --clobber
          # Leftovers from earlier runs (an asset this run did not
          # produce, e.g. its build leg failed or it was renamed) go
          # only AFTER the fresh manifest is up: the new manifest
          # carries no sha for them, so a reader already treats them
          # as unpublished during the window. The listing is its own
          # checked command: a `gh` hiccup inside a `for` list would
          # silently skip every delete.
          assets="$(gh release view latest --json assets -q '.assets[].name')"
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            [ "$asset" = "manifest.json" ] && continue
            [ -e "dist/$asset" ] || gh release delete-asset latest "$asset" --yes
          done <<< "$assets"
          gh release edit latest --notes "Built from ${GITHUB_SHA}. setup.sh downloads these when its checkout matches manifest.json's commit."

  # The macOS binaries join the release once they are built, each with
  # its sha added to the manifest the release job wrote.
  release-macos:
    name: add the macOS binaries to the latest release
    runs-on: ubuntu-latest
    needs: [release, macos]
    # Whichever macOS legs succeeded, as long as the release they join
    # went out.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A pattern, so a failed leg just means one file fewer.
      - uses: actions/download-artifact@v4
        with:
          pattern: weft-*-macos
          path: dist
          merge-multiple: true
      # SYNC: manifest.json keys <-> the release job (assemble + upload)
      - name: upload + add to the manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::no macOS binary was built; the release has none for this commit"
            exit 0
          fi
          gh release download latest --repo "$GITHUB_REPOSITORY" -p manifest.json -D .
          # One release at a time (the workflow's concurrency group), so
          # the manifest is this run's; anything else is a bug to see.
          [ "$(jq -r .commit manifest.json)" = "$GITHUB_SHA" ] || {
            echo "::error::the latest release names $(jq -r .commit manifest.json), not $GITHUB_SHA"
            exit 1
          }
          gh release upload latest "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          for f in "${files[@]}"; do
            jq --arg k "sha256_$(basename "$f")" --arg v "$(sha256sum "$f" | cut -d' ' -f1)" \
              '. + {($k): $v}' manifest.json > manifest.next && mv manifest.next manifest.json
          done
          gh release upload latest manifest.json --repo "$GITHUB_REPOSITORY" --clobber

  # ---- store publishes (each store gated on its own version tag, its
  # own tag pushed immediately after its publish, so a failure or an
  # interrupted run in one store never blocks another's retry and a
  # recorded store is never re-published into a duplicate-version
  # error) -----------------------------------------------------------
  publish-marketplace:
    name: publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [ci, vsix]
    # `contains` on the pending ARRAY fails closed: an unknown store
    # name simply is not in it.
    if: ${{ contains(fromJSON(needs.vsix.outputs.pending), 'marketplace') }}
    # The environment carries the federated credential the Azure managed
    # identity trusts; vsce then publishes with that identity's token.
    # Its own job so any protection on the environment never gates the
    # other stores. Keep the environment's deployment-branch policy
    # pinned to main: workflow_dispatch-able workflows run whatever file
    # their chosen ref carries, and the branch policy is what stops a
    # rewritten copy on a side branch from borrowing this OIDC token.
    environment: marketplace-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # install: false, so the job pays no workspace install: `pnpm
      # dlx` resolves vsce into its own store and the vsix arrives
      # prebuilt from the artifact.
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-vscode
          install: false
      - uses: actions/download-artifact@v4
        with:
          name: weft-vscode.vsix
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # The tag is the EXACT string the probe checked (the composite is
      # the one place the format exists), so probe and recorder can
      # never drift into re-publishing an existing version.
      - uses: ./.github/actions/publish-and-record
        with:
          store: the VS Code Marketplace
          run: pnpm dlx @vscode/vsce@3.9.2 publish --packagePath "$GITHUB_WORKSPACE/weft-vscode.vsix" --azure-credential
          tag: ${{ fromJSON(needs.vsix.outputs.tags).marketplace }}

  publish-openvsx:
    name: publish to Open VSX
    runs-on: ubuntu-latest
    needs: [ci, vsix]
    if: ${{ contains(fromJSON(needs.vsix.outputs.pending), 'openvsx') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-vscode
          install: false
      - uses: actions/download-artifact@v4
        with:
          name: weft-vscode.vsix
      # The namespace must exist before the first publish and creating
      # it twice is refused, so create it here and accept exactly the
      # already-exists answer; any other failure (bad token, network)
      # still stops the job before the publish confuses it further.
      - name: ensure the weavemind namespace exists
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          out="$(pnpm dlx ovsx@1.1.1 create-namespace weavemind -p "$OVSX_PAT" 2>&1)" \
            || { grep -qi "already exists" <<<"$out" || { printf '%s\n' "$out" >&2; exit 1; }; }
          printf '%s\n' "$out"
      - uses: ./.github/actions/publish-and-record
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        with:
          store: Open VSX
          run: pnpm dlx ovsx@1.1.1 publish "$GITHUB_WORKSPACE/weft-vscode.vsix"
          tag: ${{ fromJSON(needs.vsix.outputs.tags).openvsx }}

  publish-browser:
    name: publish to ${{ matrix.store }}
    runs-on: ubuntu-latest
    needs: [ci, browser]
    # The matrix IS the gate: it is built from the probe's `pending`
    # array, so a store that already carries this version has no leg
    # at all, and adding a store means touching only the probe's
    # `stores` input. One leg per store with fail-fast off, so a
    # rejected review or a broken credential in one store never blocks
    # another's submit or retry. The job-level `if` exists because an
    # EMPTY matrix vector is a workflow error, not an empty job.
    if: ${{ needs.browser.outputs.pending != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(needs.browser.outputs.pending) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
        with:
          workspace: extension-browser
      - uses: actions/download-artifact@v4
        with:
          name: browser-zips
          path: extension-browser/build
      # The per-store zip arguments live here because only this job
      # knows which zips the packaging step wrote; the publish itself
      # and its record go through the shared action.
      - id: args
        env:
          STORE: ${{ matrix.store }}
        run: |
          set -euo pipefail
          case "$STORE" in
            chrome)  args="--chrome-zip build/weft-extension-chrome.zip" ;;
            firefox) args="--firefox-zip build/weft-extension-firefox.zip --firefox-sources-zip build/weft-extension-sources.zip" ;;
            edge)    args="--edge-zip build/weft-extension-edge.zip" ;;
            *) echo "::error::no submit shape for store '$STORE'"; exit 1 ;;
          esac
          echo "value=$args" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-and-record
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # SYNC: FIREFOX_EXTENSION_ID + the build/*.zip basenames <->
          #       extension-browser/wxt.config.ts (the gecko.id and the
          #       zip artifactTemplate/sourcesTemplate + package.json name),
          #       setup.sh (the browser build block's per-target zip names)
          FIREFOX_EXTENSION_ID: extension@weavemind.ai
          FIREFOX_JWT_ISSUER: ${{ secrets.WEB_EXT_API_KEY }}
          FIREFOX_JWT_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          FIREFOX_CHANNEL: listed
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        with:
          store: ${{ matrix.store }}
          # `exec` (not a bare command): pnpm only keeps -C for builtins
          # and package scripts; an unknown bare command re-parses argv
          # and dies on "extension-browser" as a command name.
          run: pnpm -C extension-browser exec wxt submit ${{ steps.args.outputs.value }}
          tag: ${{ fromJSON(needs.browser.outputs.tags)[matrix.store] }}
