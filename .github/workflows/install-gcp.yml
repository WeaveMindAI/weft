# Install (or upgrade) weft on your own GCP project. Run it by hand from
# the Actions tab of your fork of weft. Upgrading weft is merging
# upstream into the fork and running it again.
#
# It needs, once, before the first run (the cloud chapter of the docs has
# the commands):
#   repository variables  GCP_PROJECT_ID, GCP_REGION, GCP_ZONE,
#                         TF_STATE_BUCKET, GCP_WORKLOAD_IDENTITY_PROVIDER,
#                         GCP_INSTALL_SERVICE_ACCOUNT
#   repository secrets    WEFT_DATABASE_URL (the Postgres the install keeps
#                         everything in), WEFT_DATABASE_LISTEN_URL (only
#                         when that address goes through a pooler: a
#                         direct one to the same database), WEFT_ACCESS_APPS
#                         (optional: the access-apps.json holding OAuth
#                         clients and the runtime's own keys)
#
# SYNC: the TF_VAR_* names <-> deploy/terraform/gcp/variables.tf
name: install on GCP

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: install-gcp
  cancel-in-progress: false

jobs:
  install:
    # 22.04: a runtime built here goes into the runtime image, whose
    # Debian bookworm has an older glibc than newer Ubuntus link against.
    runs-on: ubuntu-22.04
    # No deadline: a first install builds weft's images, and a run cut
    # mid-apply leaves the Terraform state locked. GitHub's own 6-hour job
    # limit is the only cap.
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_zone: ${{ vars.GCP_ZONE }}
      TF_VAR_weft_repository: ${{ github.repository }}
      TF_VAR_weft_commit: ${{ github.sha }}
    steps:
      # Before anything is built: without a database there is nothing to
      # install.
      - name: the database
        env:
          WEFT_DATABASE_URL: ${{ secrets.WEFT_DATABASE_URL }}
        run: |
          if [ -z "$WEFT_DATABASE_URL" ]; then
            echo "::error::the repository secret WEFT_DATABASE_URL is not set: weft needs a Postgres to keep everything in (the cloud chapter of the docs walks through getting one)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INSTALL_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # GitHub signs in as the install's account through a grant made just
      # before the first run (the cloud chapter's commands), and Google
      # can take a few minutes to apply it: until then every call is
      # refused with `iam.serviceAccounts.getAccessToken`. Asking for a
      # token is that same exchange, so it is asked until Google says yes.
      - name: wait for Google to accept GitHub's sign-in
        run: |
          for attempt in $(seq 1 40); do
            if err=$(gcloud auth print-access-token 2>&1 >/dev/null); then
              exit 0
            fi
            echo "Google does not accept this workflow's sign-in yet (a new grant takes a few minutes to apply); asking again in 15s"
            sleep 15
          done
          echo "::error::Google still refuses this workflow's sign-in after 10 minutes, so the grant is missing rather than still applying. Check the GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_INSTALL_SERVICE_ACCOUNT variables and the commands in the cloud chapter. Google's answer: $err"
          exit 1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # The registry first: the images this checkout names are pushed there
      # before the services that run them exist.
      - name: create the registry
        working-directory: deploy/terraform/gcp
        env:
          TF_VAR_runtime_image: unset
          TF_VAR_builder_base_image: unset
          TF_VAR_database_url: unset
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve \
            -target=google_project_service.apis -target=google_artifact_registry_repository.images

      # The CLI weft's release built from this exact source, waited for
      # when that release is still being built; otherwise built here,
      # with the runtime, from a cache that keeps the dependencies
      # between runs, so only what changed in weft compiles again.
      - name: the weft CLI for this checkout
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/release-cli.sh . target/release; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" -eq 2 ] || exit "$rc"
          fi
      - if: steps.release.outputs.found != 'yes'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.release.outputs.found != 'yes'
      - name: build the weft CLI and runtime
        if: steps.release.outputs.found != 'yes'
        run: cargo build --release --locked -p weft-cli -p weft-runtime

      # The runtime image and the worker builder base this checkout names,
      # pushed to the install's registry. Each is taken from the install's
      # registry if there, else copied from the release's (the same tag is
      # the same contents), else built. A fork carrying its own changes
      # hashes to new tags and gets exactly its own runtime, made from the
      # `weft-runtime` built above instead of compiled again in Docker.
      - name: build the runtime's images
        env:
          BUILT_HERE: ${{ steps.release.outputs.found != 'yes' }}
        run: |
          registry=$(terraform -chdir=deploy/terraform/gcp output -raw registry)
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          runtime=()
          [ "$BUILT_HERE" = true ] && runtime=(--runtime-binary target/release/weft-runtime)
          WEFT_IMAGE_REGISTRY="$registry" ./target/release/weft build-images --push "${runtime[@]}" > "$RUNNER_TEMP/refs.txt"
          # SYNC: `weft build-images` stdout and its order <-> crates/weft-cli/src/images.rs (SharedImages::bare_refs), .github/workflows/release.yml (build + push shared images)
          echo "TF_VAR_runtime_image=$(sed -n 1p "$RUNNER_TEMP/refs.txt")" >> "$GITHUB_ENV"
          echo "TF_VAR_builder_base_image=$(sed -n 2p "$RUNNER_TEMP/refs.txt")" >> "$GITHUB_ENV"

      - name: create the cloud
        working-directory: deploy/terraform/gcp
        env:
          TF_VAR_access_apps_json: ${{ secrets.WEFT_ACCESS_APPS }}
          TF_VAR_database_url: ${{ secrets.WEFT_DATABASE_URL }}
          TF_VAR_database_listen_url: ${{ secrets.WEFT_DATABASE_LISTEN_URL }}
        run: terraform apply -input=false -auto-approve

      # The standard library's files, stored in the install now, so a
      # project's first deploy uploads only its own files (a local install
      # does the same each time it starts). The key goes from Secret
      # Manager straight to the CLI, never into the log.
      - name: preload the standard library
        working-directory: deploy/terraform/gcp
        run: |
          url=$(terraform output -raw url)
          key_secret=$(terraform output -raw bootstrap_operator_key_secret)
          gcloud secrets versions access latest --secret "$key_secret" --project "${{ vars.GCP_PROJECT_ID }}" \
            | "$GITHUB_WORKSPACE/target/release/weft" catalog preload --dispatcher "$url" --key-stdin

      # Written to the run's log as well as its summary: `gh run view`
      # shows the log, never the summary, and whoever installs from a
      # terminal needs the address and the key command from there.
      - name: what to do next
        working-directory: deploy/terraform/gcp
        run: |
          url=$(terraform output -raw url)
          key_secret=$(terraform output -raw bootstrap_operator_key_secret)
          key_command="gcloud secrets versions access latest --secret $key_secret --project ${{ vars.GCP_PROJECT_ID }}"
          {
            echo "## weft is installed"
            echo
            echo "It answers at \`$url\`, with nothing running while nobody uses it."
            echo
            echo "1. In a project: \`weft target add prod $url\`."
            echo "2. Log in with the first operator key, read straight from Secret Manager on your machine (it never appears in these logs):"
            echo
            echo '```'
            echo "$key_command | weft login prod --key-stdin"
            echo '```'
            echo
            echo "3. For your own domain, which needs a load balancer that costs money while it stands: \`weft domain add weft.example.com --on prod --accept-cost\` prints the DNS record to set."
            echo
            echo "The logs: \`gcloud logging read 'resource.type=\"cloud_run_revision\"' --project ${{ vars.GCP_PROJECT_ID }} --freshness 1h\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
