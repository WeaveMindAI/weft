# Install (or upgrade) weft on your own GCP project. Run it by hand from
# the Actions tab of your fork of weft. Upgrading weft is merging
# upstream into the fork and running it again. Its one input,
# reset_database, is for an install whose database an older weft built
# from a schema history this one cannot carry forward (the step "the
# database's history" says when).
#
# It needs, once, before the first run (the cloud chapter of the docs has
# the commands):
#   repository variables  GCP_PROJECT_ID, GCP_REGION, GCP_ZONE,
#                         TF_STATE_BUCKET, GCP_WORKLOAD_IDENTITY_PROVIDER,
#                         GCP_INSTALL_SERVICE_ACCOUNT
#                         (and optionally WEFT_DATABASE=cloud_sql and
#                         WEFT_CLOUD_SQL_TIER, below, and the sizes below)
#   optional sizes        WEFT_CLOUD_SQL_MAX_CONNECTIONS (with cloud_sql:
#                         how many connections its Postgres takes at once;
#                         unset, Cloud SQL's own number for the tier),
#                         WEFT_DISPATCHER_MAX_COPIES (the most copies of the
#                         dispatcher running at once; 2 when unset),
#                         WEFT_BROKER_MAX_COPIES (the same for the broker;
#                         4 when unset). Each copy of those two takes an
#                         equal share of the database's connections.
#                         WEFT_DISPATCHER_MEMORY, WEFT_BROKER_MEMORY,
#                         WEFT_LISTENER_MEMORY, WEFT_SUPERVISOR_MEMORY (the
#                         memory of each copy of that role, from 512Mi to
#                         4Gi; 1Gi for the dispatcher and 512Mi for the
#                         others when unset), WEFT_HOLDER_MEMORY (each
#                         holder's, at least 512Mi, 512Mi when unset).
#   repository secrets    WEFT_DATABASE_URL (the Postgres the install keeps
#                         everything in; not needed with the variable
#                         WEFT_DATABASE set to cloud_sql, which gives the
#                         install a Postgres of its own on Cloud SQL, and
#                         copies the data of the one it used before into
#                         it), WEFT_DATABASE_LISTEN_URL (only
#                         when that address goes through a pooler: a
#                         direct one to the same database), WEFT_ACCESS_APPS
#                         (optional: the access-apps.json holding OAuth
#                         clients and the runtime's own keys),
#                         WEFT_ALERT_EMAIL (optional: where the alerts go
#                         when weft's own work is stuck; without it, a
#                         person holding Owner on the project)
#
# SYNC: the TF_VAR_* names <-> deploy/terraform/gcp/variables.tf
name: install on GCP

on:
  workflow_dispatch:
    inputs:
      # SYNC: reset_database <-> crates/weft-runtime/src/schema.rs (explain)
      reset_database:
        description: "Wipe the install's database, ONLY if an older weft built it from a schema history this one cannot carry forward, and start it fresh. This deletes every project's run history, versions and stored connections."
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: install-gcp
  cancel-in-progress: false

jobs:
  install:
    # 24.04: a runtime built here goes into the runtime image, Debian
    # trixie, so its glibc (2.39) must not be newer than trixie's (2.41).
    runs-on: ubuntu-24.04
    # No deadline: a first install builds weft's images, and a run cut
    # mid-apply leaves the Terraform state locked. GitHub's own 6-hour job
    # limit is the only cap.
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_zone: ${{ vars.GCP_ZONE }}
      TF_VAR_weft_repository: ${{ github.repository }}
      TF_VAR_weft_commit: ${{ github.sha }}
      # `cloud_sql` gives the install a Postgres of its own; unset, it
      # uses the one WEFT_DATABASE_URL names.
      TF_VAR_cloud_sql: ${{ vars.WEFT_DATABASE == 'cloud_sql' }}
      TF_VAR_cloud_sql_tier: ${{ vars.WEFT_CLOUD_SQL_TIER || 'db-g1-small' }}
    steps:
      # Before anything is built: without a database there is nothing to
      # install.
      - name: the database
        env:
          WEFT_DATABASE_URL: ${{ secrets.WEFT_DATABASE_URL }}
          WEFT_DATABASE: ${{ vars.WEFT_DATABASE }}
        run: |
          case "$WEFT_DATABASE" in
            cloud_sql) exit 0 ;;
            "") ;;
            *)
              echo "::error::the repository variable WEFT_DATABASE is '$WEFT_DATABASE'; it is cloud_sql (a Postgres of the install's own) or unset (the one WEFT_DATABASE_URL names)"
              exit 1 ;;
          esac
          if [ -z "$WEFT_DATABASE_URL" ]; then
            echo "::error::the repository secret WEFT_DATABASE_URL is not set: weft needs a Postgres to keep everything in (the cloud chapter of the docs walks through getting one), or set the repository variable WEFT_DATABASE to cloud_sql for one of the install's own"
            exit 1
          fi

      # The optional sizes, handed to Terraform only when set: an unset
      # repository variable reads as an empty string, which Terraform
      # refuses for a number or a memory size, so an unset one leaves
      # Terraform's default.
      # SYNC: these TF_VAR_* names <-> deploy/terraform/gcp/variables.tf
      - name: the optional sizes
        env:
          CLOUD_SQL_MAX_CONNECTIONS: ${{ vars.WEFT_CLOUD_SQL_MAX_CONNECTIONS }}
          DISPATCHER_MAX_COPIES: ${{ vars.WEFT_DISPATCHER_MAX_COPIES }}
          BROKER_MAX_COPIES: ${{ vars.WEFT_BROKER_MAX_COPIES }}
          DISPATCHER_MEMORY: ${{ vars.WEFT_DISPATCHER_MEMORY }}
          BROKER_MEMORY: ${{ vars.WEFT_BROKER_MEMORY }}
          LISTENER_MEMORY: ${{ vars.WEFT_LISTENER_MEMORY }}
          SUPERVISOR_MEMORY: ${{ vars.WEFT_SUPERVISOR_MEMORY }}
          HOLDER_MEMORY: ${{ vars.WEFT_HOLDER_MEMORY }}
        run: |
          set_if_given() {
            if [ -n "$2" ]; then
              echo "$1=$2" >> "$GITHUB_ENV"
            fi
          }
          set_if_given TF_VAR_cloud_sql_max_connections "$CLOUD_SQL_MAX_CONNECTIONS"
          set_if_given TF_VAR_dispatcher_max_copies "$DISPATCHER_MAX_COPIES"
          set_if_given TF_VAR_broker_max_copies "$BROKER_MAX_COPIES"
          set_if_given TF_VAR_dispatcher_memory "$DISPATCHER_MEMORY"
          set_if_given TF_VAR_broker_memory "$BROKER_MEMORY"
          set_if_given TF_VAR_listener_memory "$LISTENER_MEMORY"
          set_if_given TF_VAR_supervisor_memory "$SUPERVISOR_MEMORY"
          set_if_given TF_VAR_holder_memory "$HOLDER_MEMORY"

      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INSTALL_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # GitHub signs in as the install's account through a grant made just
      # before the first run (the cloud chapter's commands), and Google
      # can take a few minutes to apply it: until then every call is
      # refused with `iam.serviceAccounts.getAccessToken`. Asking for a
      # token is that same exchange, so it is asked until Google says yes.
      - name: wait for Google to accept GitHub's sign-in
        run: |
          for attempt in $(seq 1 40); do
            if err=$(gcloud auth print-access-token 2>&1 >/dev/null); then
              exit 0
            fi
            echo "Google does not accept this workflow's sign-in yet (a new grant takes a few minutes to apply); asking again in 15s"
            sleep 15
          done
          echo "::error::Google still refuses this workflow's sign-in after 10 minutes, so the grant is missing rather than still applying. Check the GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_INSTALL_SERVICE_ACCOUNT variables and the commands in the cloud chapter. Google's answer: $err"
          exit 1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # The registry first: the images this checkout names are pushed there
      # before the services that run them exist. Every targeted apply also
      # targets both ends of every `moved` block, which Terraform requires
      # while a rename still has to happen in the state, so an install last
      # updated before any rename goes through.
      - name: create the registry
        working-directory: deploy/terraform/gcp
        env:
          TF_VAR_runtime_image: unset
          TF_VAR_builder_base_image: unset
          TF_VAR_database_url: unset
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          targets=$("$GITHUB_WORKSPACE/scripts/terraform-moved-targets.sh" .)
          renamed=()
          [ -z "$targets" ] || mapfile -t renamed <<<"$targets"
          terraform apply -input=false -auto-approve \
            -target=google_project_service.apis -target=google_artifact_registry_repository.images \
            "${renamed[@]}"

      # The CLI weft's release built from this exact source, waited for
      # when that release is still being built; otherwise built here,
      # with the runtime, from a cache that keeps the dependencies
      # between runs, so only what changed in weft compiles again.
      - name: the weft CLI for this checkout
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/release-cli.sh . target/release; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" -eq 2 ] || exit "$rc"
          fi
      - if: steps.release.outputs.found != 'yes'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.release.outputs.found != 'yes'
      - name: build the weft CLI and runtime
        if: steps.release.outputs.found != 'yes'
        run: cargo build --release --locked -p weft-cli -p weft-runtime

      # Before anything of the running install is replaced: an update never
      # runs beside what the install has on. `weft maintenance on` switches
      # it all off, and `weft maintenance off` brings it back once this has
      # run. A first install has no address yet, and so nothing to check;
      # one whose weft predates the maintenance cannot be asked, and goes
      # ahead (`weft maintenance check` says so).
      - name: nothing is on in the install
        working-directory: deploy/terraform/gcp
        run: |
          if ! url=$(terraform output -raw url 2>/dev/null) || [ -z "$url" ]; then
            echo "no install yet, so nothing to check"
            exit 0
          fi
          # The install's own operator key, as in every step below that reads it.
          # Read before this run applies anything, so from what the last run
          # left: an install last updated before the key's secret was renamed
          # names it under its old output, and this run renames it (same key).
          # SYNC: install_key_secret <-> deploy/terraform/gcp/outputs.tf
          key_secret=$(terraform output -raw install_key_secret 2>/dev/null || terraform output -raw bootstrap_operator_key_secret)
          if ! gcloud secrets versions access latest --secret "$key_secret" --project "${{ vars.GCP_PROJECT_ID }}" \
              | "$GITHUB_WORKSPACE/target/release/weft" maintenance check --dispatcher "$url" --key-stdin --update "run this workflow again"; then
            echo "::error::the install has something on, so nothing was replaced; the steps to update are just above"
            exit 1
          fi

      # The runtime image, the worker builder base and the standard worker
      # this checkout names, pushed to the install's registry. Each is taken
      # from the install's registry if there, else copied from the
      # release's (the same tag is the same contents), else built. A fork
      # carrying its own changes hashes to new tags and gets exactly its
      # own runtime, made from the `weft-runtime` built above instead of
      # compiled again in Docker. The standard worker is the one every
      # project whose nodes are all the standard library's runs, so the
      # first of them after this update finds it ready and builds nothing
      # (crates/weft-dispatcher/src/build/mod.rs, `built_whole`).
      - name: build the runtime's images
        env:
          BUILT_HERE: ${{ steps.release.outputs.found != 'yes' }}
          # A build names the install whose compile caches it fills
          # (`weft_compiler::build::install_cache_key`), and a tag checks out
          # on no branch, which picks none. This runner's caches go with it.
          # SYNC: WEFT_INSTALL <-> crates/weft-core/src/infra/install.rs (INSTALL_ENV)
          WEFT_INSTALL: default
        run: |
          registry=$(terraform -chdir=deploy/terraform/gcp output -raw registry)
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          runtime=()
          [ "$BUILT_HERE" = true ] && runtime=(--runtime-binary target/release/weft-runtime)
          WEFT_IMAGE_REGISTRY="$registry" ./target/release/weft build-images --push "${runtime[@]}" > "$RUNNER_TEMP/refs.txt"
          # SYNC: `weft build-images` stdout and its order <-> crates/weft-cli/src/images.rs (ReleaseImages::bare_refs), .github/workflows/release.yml (build + push shared images)
          echo "TF_VAR_runtime_image=$(sed -n 1p "$RUNNER_TEMP/refs.txt")" >> "$GITHUB_ENV"
          echo "TF_VAR_builder_base_image=$(sed -n 2p "$RUNNER_TEMP/refs.txt")" >> "$GITHUB_ENV"

      # Where the install emails when weft's own work is stuck
      # (deploy/terraform/gcp/alerts.tf): the repository secret
      # WEFT_ALERT_EMAIL when set, or else a person holding the Owner role
      # directly on the project (the first by address), usually the Google
      # account that made it. This workflow signs in as the install's
      # service account, which has no inbox. A secret, not a variable: a
      # step prints its variables in its log before its script runs, and a
      # fork's run logs can be public; a secret is masked from the start.
      - name: who gets the alerts
        shell: bash
        env:
          WEFT_ALERT_EMAIL: ${{ secrets.WEFT_ALERT_EMAIL }}
        run: |
          email="$WEFT_ALERT_EMAIL"
          if [ -z "$email" ]; then
            email=$(gcloud projects get-iam-policy "${{ vars.GCP_PROJECT_ID }}" \
              --flatten=bindings --filter=bindings.role=roles/owner --format='value(bindings.members)' \
              | tr ';' '\n' | sed -n 's/^user://p' | sort | head -n 1)
          fi
          # A fork's run logs can be public: the address is masked in them,
          # Terraform's plan included.
          if [ -n "$email" ]; then
            echo "::add-mask::$email"
          fi
          echo "TF_VAR_alert_email=$email" >> "$GITHUB_ENV"

      # An install moving to a Postgres of its own: the instance is made
      # first, with the roles still on the database they use, then that
      # database is copied into it (while the install is in maintenance,
      # which the step above made sure of), and only then does the next
      # step point the roles at it. Every run that finds the roles not yet
      # on it copies again from scratch, so a failed copy, or a switch that
      # never happened, is never taken as done; once the roles use it,
      # every later run passes straight through.
      - name: move the database into the install's own
        if: vars.WEFT_DATABASE == 'cloud_sql'
        working-directory: deploy/terraform/gcp
        env:
          TF_VAR_database_url: ${{ secrets.WEFT_DATABASE_URL }}
          TF_VAR_database_listen_url: ${{ secrets.WEFT_DATABASE_LISTEN_URL }}
        run: |
          if ! url=$(terraform output -raw url 2>/dev/null) || [ -z "$url" ]; then
            echo "a new install starts on its own Postgres; nothing to move"
            exit 0
          fi
          targets=$("$GITHUB_WORKSPACE/scripts/terraform-moved-targets.sh" .)
          renamed=()
          [ -z "$targets" ] || mapfile -t renamed <<<"$targets"
          terraform apply -input=false -auto-approve \
            -target=google_secret_manager_secret_version.cloud_sql_url \
            -target=google_secret_manager_secret_iam_member.core_reads_cloud_sql_url \
            -target=google_compute_subnetwork.roles \
            "${renamed[@]}"
          move=$(terraform output -json database_move)
          project="${{ vars.GCP_PROJECT_ID }}"
          region="${{ vars.GCP_REGION }}"
          from=""
          for secret in $(echo "$move" | jq -r '.from_secrets[]'); do
            if gcloud secrets describe "$secret" --project "$project" >/dev/null 2>&1; then
              from="$secret"
              break
            fi
          done
          if [ -z "$from" ]; then
            echo "::error::the install names no database to move from (none of $(echo "$move" | jq -r '.from_secrets | join(", ")') is in Secret Manager)"
            exit 1
          fi
          to=$(echo "$move" | jq -r .to_secret)
          # What the roles read decides it, never the source picked above (a
          # direct address can outlive the switch when the apply that drops
          # it failed). Read here only to compare, never printed.
          roles=$(echo "$move" | jq -r .roles_secret)
          if [ "$(gcloud secrets versions access latest --secret "$roles" --project "$project")" = \
               "$(gcloud secrets versions access latest --secret "$to" --project "$project")" ]; then
            echo "the install already uses its own Postgres; nothing to move"
            exit 0
          fi
          job=$(echo "$move" | jq -r .job)
          # The install's own database is used only once the roles are
          # pointed at it, so until then whatever it holds (an earlier copy
          # whose switch never happened) is stale: it is emptied and filled
          # again in the one transaction that restores the dump, and the dump
          # is taken whole, to a file, before any of it is restored.
          script='set -euo pipefail
          pg_dump --no-owner --no-privileges --file /tmp/dump.sql "$FROM"
          tail -n 5 /tmp/dump.sql | grep -q "PostgreSQL database dump complete"
          { echo "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"; cat /tmp/dump.sql; } \
            | psql --single-transaction -v ON_ERROR_STOP=1 -q "$TO"
          echo copied'
          gcloud run jobs deploy "$job" --project "$project" --region "$region" --quiet \
            --image docker.io/library/postgres:18 \
            --service-account "$(echo "$move" | jq -r .service_account)" \
            --network "$(echo "$move" | jq -r .network)" --subnet "$(echo "$move" | jq -r .subnet)" \
            --vpc-egress private-ranges-only \
            --set-secrets "FROM=$from:latest,TO=$to:latest" \
            --command bash --args="^~^-c~$script" \
            --memory 4Gi --max-retries 0 --task-timeout 21600s
          moved=0
          gcloud run jobs execute "$job" --project "$project" --region "$region" --wait || moved=$?
          gcloud run jobs delete "$job" --project "$project" --region "$region" --quiet
          if [ "$moved" -ne 0 ]; then
            echo "::error::copying the database into the install's own failed, so the install still uses the one it had and the new one is empty; its log: gcloud logging read 'resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$job\"' --project $project --freshness 1h"
            exit 1
          fi

      # Before any role is deployed: a database an older weft built from a
      # schema history this one cannot carry forward (the history restarted
      # since) is refused by every new role's boot, while Cloud Run keeps
      # sending traffic to the old ones. The runtime image just pushed says
      # where the database the roles boot on stands, from a Cloud Run job in
      # the install's network (an install's own Cloud SQL has only a private
      # address). Older, with reset_database on: the same job wipes it and
      # builds this weft's schema in one go, so an old copy woken afterwards
      # refuses the database instead of building its old tables in it again.
      # Older with the input off: nothing is deployed. A first install has
      # no database of its own to check yet.
      - name: the database's history
        working-directory: deploy/terraform/gcp
        env:
          RESET_DATABASE: ${{ inputs.reset_database }}
          TF_VAR_database_url: ${{ secrets.WEFT_DATABASE_URL }}
          TF_VAR_database_listen_url: ${{ secrets.WEFT_DATABASE_LISTEN_URL }}
        run: |
          if ! url=$(terraform output -raw url 2>/dev/null) || [ -z "$url" ]; then
            if [ "$RESET_DATABASE" = true ]; then
              echo "::error::reset_database is on, and there is no install yet whose database could be reset; run this again with it off"
              exit 1
            fi
            echo "no install yet, so no database to check"
            exit 0
          fi
          # Only what the job needs: the address of the database this run
          # deploys the roles on, in a secret the roles never read (theirs
          # names the one they boot on now until the cloud is created), and
          # the step's output written into the state an older run left.
          targets=$("$GITHUB_WORKSPACE/scripts/terraform-moved-targets.sh" .)
          renamed=()
          [ -z "$targets" ] || mapfile -t renamed <<<"$targets"
          terraform apply -input=false -auto-approve \
            -target=google_service_account.core -target=google_compute_subnetwork.roles \
            -target=google_secret_manager_secret_version.database_check \
            -target=google_secret_manager_secret_iam_member.core_reads_database_check \
            "${renamed[@]}"
          check=$(terraform output -json database_check)
          project="${{ vars.GCP_PROJECT_ID }}"
          region="${{ vars.GCP_REGION }}"
          job=$(echo "$check" | jq -r .job)
          # SYNC: the subcommand and its flag <-> crates/weft-runtime/src/main.rs (Command::DatabaseHistory)
          args=database-history
          [ "$RESET_DATABASE" = true ] && args=database-history,--wipe-older
          gcloud run jobs deploy "$job" --project "$project" --region "$region" --quiet \
            --image "$TF_VAR_runtime_image" \
            --service-account "$(echo "$check" | jq -r .service_account)" \
            --network "$(echo "$check" | jq -r .network)" --subnet "$(echo "$check" | jq -r .subnet)" \
            --vpc-egress private-ranges-only \
            --set-secrets "WEFT_DATABASE_URL=$(echo "$check" | jq -r .database_secret):latest" \
            --args="$args" \
            --max-retries 0 --task-timeout 3600s
          checked=0
          gcloud run jobs execute "$job" --project "$project" --region "$region" --wait || checked=$?
          gcloud run jobs delete "$job" --project "$project" --region "$region" --quiet
          logs="gcloud logging read 'resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$job\"' --project $project --freshness 1h"
          if [ "$checked" -ne 0 ]; then
            if [ "$RESET_DATABASE" = true ]; then
              echo "::error::the database was not reset, and nothing was deployed. Either it is not from an older weft (then it needs no reset: run this again with reset_database off), or the reset failed; its log says which: $logs"
            else
              echo "::error::the install's database cannot be used by this weft, so nothing was deployed. If its log says an older weft built it, run this workflow again with reset_database on, which deletes every project's run history, versions and stored connections and starts the database fresh; otherwise it says what went wrong: $logs"
            fi
            exit 1
          fi
          echo "the install's database is ready for this weft's roles"

      - name: create the cloud
        working-directory: deploy/terraform/gcp
        env:
          TF_VAR_access_apps_json: ${{ secrets.WEFT_ACCESS_APPS }}
          TF_VAR_database_url: ${{ secrets.WEFT_DATABASE_URL }}
          TF_VAR_database_listen_url: ${{ secrets.WEFT_DATABASE_LISTEN_URL }}
        run: terraform apply -input=false -auto-approve

      # The apply rolled each role's new revision out and waited for it to
      # be ready. Deleting the older revisions stops their copies (Cloud
      # Run sends each SIGTERM, and it finishes what it was answering,
      # closes what it held open and exits), so the old weft does not keep
      # taking work beside the new one. A service whose latest revision is
      # not ready, or does not get all of its requests, fails this step
      # naming it, and nothing is deleted.
      - name: stop the old copies
        working-directory: deploy/terraform/gcp
        run: |
          mapfile -t services < <(terraform output -json role_services | jq -r '.[]')
          "$GITHUB_WORKSPACE/scripts/delete-old-role-revisions.sh" "${{ vars.GCP_PROJECT_ID }}" "${{ vars.GCP_REGION }}" "${services[@]}"

      # The standard library's files, stored in the install now, so a
      # project's first deploy uploads only its own files (a local install
      # does the same each time it starts). The key goes from Secret
      # Manager straight to the CLI, never into the log.
      - name: preload the standard library
        working-directory: deploy/terraform/gcp
        run: |
          url=$(terraform output -raw url)
          key_secret=$(terraform output -raw install_key_secret)
          gcloud secrets versions access latest --secret "$key_secret" --project "${{ vars.GCP_PROJECT_ID }}" \
            | "$GITHUB_WORKSPACE/target/release/weft" catalog preload --dispatcher "$url" --key-stdin

      # The CLI this run used (the release's for this exact source, or the
      # one built above), stored in the install under that source's tree, so
      # a project's deploy downloads it (`GET /install/cli/<tree>`, through
      # scripts/release-cli.sh) instead of compiling it: a fork's CLI exists
      # nowhere else. The deploy runs on the same runner as this job
      # (ubuntu-24.04, x86_64), so this binary runs there. The sha256 goes
      # last, since it is what says the CLI is whole, and only this source's
      # CLI is kept: once the install runs it, no deploy asks for another.
      # This workflow's account writes the bucket as the project's Owner.
      # SYNC: install/cli/<tree>/{weft,sha256} <-> crates/weft-core/src/install.rs (install_cli_keys)
      # SYNC: runs-on <-> crates/weft-cli/templates/ci/gcp.yml (runs-on)
      - name: store the weft CLI in the install
        working-directory: deploy/terraform/gcp
        run: |
          bucket=$(terraform output -raw files_bucket)
          tree=$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')
          cli="$GITHUB_WORKSPACE/target/release/weft"
          sha256sum "$cli" | cut -d' ' -f1 > "$RUNNER_TEMP/cli.sha256"
          gcloud storage cp "$cli" "gs://$bucket/install/cli/$tree/weft"
          gcloud storage cp "$RUNNER_TEMP/cli.sha256" "gs://$bucket/install/cli/$tree/sha256"
          gcloud storage ls "gs://$bucket/install/cli/" | { grep -v "/install/cli/$tree/\$" || true; } \
            | xargs -r gcloud storage rm --recursive

      # Written to the run's log as well as its summary: `gh run view`
      # shows the log, never the summary, and whoever installs from a
      # terminal needs the address and the key command from there.
      - name: what to do next
        working-directory: deploy/terraform/gcp
        run: |
          url=$(terraform output -raw url)
          key_secret=$(terraform output -raw install_key_secret)
          key_command="gcloud secrets versions access latest --secret $key_secret --project ${{ vars.GCP_PROJECT_ID }}"
          {
            echo "## weft is installed"
            echo
            echo "It answers at \`$url\`, with nothing running while nobody uses it."
            echo
            echo "1. In a project: \`weft target add prod $url\`."
            echo "2. Log in with the install's own operator key, read straight from Secret Manager on your machine (it never appears in these logs):"
            echo
            echo '```'
            echo "$key_command | weft login prod --key-stdin"
            echo '```'
            echo
            echo "3. For your own domain, which needs a load balancer that costs money while it stands: \`weft domain add weft.example.com --on prod --accept-cost\` prints the DNS record to set."
            echo
            echo "The logs: \`gcloud logging read 'resource.type=\"cloud_run_revision\"' --project ${{ vars.GCP_PROJECT_ID }} --freshness 1h\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
