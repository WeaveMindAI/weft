name: Feature request
description: Suggest a new capability, a language change, or an improvement to the editor.
labels: ["feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening this, skim [the design principles](https://weavemindai.github.io/weft/thinking/design-principles.html) and [the roadmap](https://weavemindai.github.io/weft/appendix/roadmap.html). Weft is opinionated, so some changes we will probably end up talking you out of, and that is a much nicer conversation to have in an issue than in review.

        If you want a new **node** (not a language change), use the "Node request" template instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation. What are you building, what gets in the way, what would the ideal fix look like?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see. Syntax, behavior, UI, whatever applies. Be as concrete as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Things you tried or thought about that did not work.

  - type: textarea
    id: design-fit
    attributes:
      label: How does this fit the design principles?
      description: Point to the principles this supports, or the one it pulls against. If it breaks one, tell us why the trade is worth it.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for duplicates.
          required: true
