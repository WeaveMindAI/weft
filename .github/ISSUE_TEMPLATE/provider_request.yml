name: Provider request
description: Ask for a paid provider to be usable on the shared keys in app.weavemind.ai.
labels: ["provider-request", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ask here for a provider whose calls people can make without bringing their own key, billed to app.weavemind.ai instead.

        You are not blocked waiting on us. A provider defined inside your own project works today with your own key: write its meter as a shared `.rs` file in your package ([how meters work](https://weavemindai.github.io/weft/connections/meters.html)) and set the key on the node. This request is only about the shared keys, which need a reviewed meter shipped in weft itself.

  - type: input
    id: name
    attributes:
      label: Provider name
      description: The lowercase name the meter uses (its key lives in `<NAME>_API_KEY`).
      placeholder: elevenlabs, tavily, deepgram, etc.
    validations:
      required: true

  - type: input
    id: base-url
    attributes:
      label: API base URL
      placeholder: https://api.elevenlabs.io/v1
    validations:
      required: true

  - type: textarea
    id: pricing
    attributes:
      label: How does it charge?
      description: How is a call priced (per token, per second of audio, per image, one flat credit per call)? Does the response report the cost, or is there a separate endpoint to look it up? A link to the provider's pricing page helps.
    validations:
      required: true

  - type: textarea
    id: existing-meter
    attributes:
      label: Meter you already wrote (if any)
      description: If you have already written this provider's meter in your own project, paste it or link a repo. A working meter is most of the review.
      render: rust
    validations:
      required: false

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you building that needs this provider? A concrete scenario helps us prioritize.
    validations:
      required: true
