---
# The one front door (Envoy Gateway). Three listeners on one Gateway,
# each on its own port, so what one of them lets through can never be
# reached from another:
#
#   - `http` (80): live caller connections, routed all the way to ONE
#     worker pod (below).
#   - `local` (81): the dispatcher, every path. What the operator's
#     machine reaches at the loopback port the kind node maps
#     (`MappedPort::Local`), and where every link the dispatcher mints
#     for this machine points (storage downloads, signal URLs).
#   - `public` (8080): the public trigger surface. Only the allowlisted
#     routes below attach to it, and only the public tunnel reaches it
#     (through the `weft-public-door` Service in public-tunnel.yaml), so
#     "only the allowlist is public" is a fact of the wiring, not of a
#     rule someone could forget.
#
# The live listener routes an outside caller all the way to ONE specific worker pod, by
# encoding the pod + its namespace in the request's leftmost two DNS
# labels: `<pod>.<namespace>.<gateway-host>`. A single GatewayClass +
# Gateway + HTTPRoute + DynamicResolver Backend handle EVERY project and
# EVERY pod (O(1) objects, scales flat to any pod count); per-pod routing
# is done by a tiny Lua snippet that rewrites the upstream Host from the
# subdomain to the pod's internal cluster DNS. The headless Service
# (`weft-workers`, applied per project by the dispatcher) publishes that
# DNS. TLS terminates here; the hop to the worker is plain HTTP on the
# private cluster network, and the dispatcher-signed routing token (the
# `wct` query param, verified inside the worker) authenticates.
#
# SYNC: weft-workers + port 9091 <-> crates/weft-dispatcher/src/backend/k8s_worker.rs (WORKER_CONNECTION_PORT, worker_headless_service_name), crates/weft-cli/src/commands/daemon.rs (gateway install)
#
# Template vars (substituted by the CLI daemon at apply, like the other
# manifests): ${GATEWAY_HOST} is the public wildcard host suffix
# (e.g. `live.example.com`, or an `<ip>.nip.io`-style host). The listener
# matches `*.${GATEWAY_HOST}` so any `<pod>.<ns>.${GATEWAY_HOST}` lands here.

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: weft-live
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: weft-live-proxy
    namespace: envoy-gateway-system
---
# The proxy's own Service is a ClusterIP. Envoy Gateway's default is a
# LoadBalancer, which nothing here provisions: it would stay pending
# (the Gateway never reports Programmed) and allocate one node port per
# listener out of the small band project doors are published on
# (`NODE_PORTS`). The operator's machine and the tunnel reach the
# listeners through the pinned NodePort Services in kind-node-ports.yaml
# and public-tunnel.yaml instead.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: weft-live-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: weft-live-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: weft-live
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Wildcard host: every `<pod>.<ns>.${GATEWAY_HOST}` matches. A
      # TLS-terminating deployment adds an HTTPS listener (port 443) with
      # the wildcard cert; plain-HTTP (loopback) has only this listener.
      hostname: "*.${GATEWAY_HOST}"
      allowedRoutes:
        namespaces:
          from: All
    # The dispatcher door. No hostname: a link the dispatcher mints
    # carries whatever Host the caller used to reach it. Routes from
    # every namespace attach here, since a project's `TenantPublic`
    # endpoint (weft-core `infra::compile`) is an HTTPRoute in the
    # project's own namespace. Envoy Gateway runs its proxy unprivileged
    # and moves a listener below 1024 up by 10000, so the container
    # listens on 10081.
    # SYNC: listener `local` + container port 10081 <-> deploy/k8s/kind-node-ports.yaml
    #       (weft-local-door-node-port), crates/weft-core/src/infra/compile.rs
    #       (compile_http_route's parentRef)
    - name: local
      protocol: HTTP
      port: 81
      allowedRoutes:
        namespaces:
          from: All
    # The public trigger surface. Only routes in this namespace may
    # attach, and only the allowlist below does.
    # SYNC: listener `public` + port 8080 <-> deploy/k8s/public-tunnel.yaml
    #       (weft-public-door, tunnel-egress)
    - name: public
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
---
# The dynamic-forward-proxy backend: Envoy resolves the upstream from the
# (rewritten) Host header at request time, so no per-pod Service or route
# is needed. Plain HTTP upstream (TLS terminated at the listener).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: weft-worker-dynamic
  namespace: envoy-gateway-system
spec:
  type: DynamicResolver
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weft-live-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: weft-live-gateway
      sectionName: http
  hostnames:
    - "*.${GATEWAY_HOST}"
  rules:
    - filters:
        # Rewrite the upstream Host from the `x-weft-upstream` header the
        # Lua set (the pod's internal DNS). This is the supported way to
        # steer a DynamicResolver upstream WITHOUT touching `:authority`,
        # so HTTPRoute hostname matching still sees the original public
        # host. The Lua cannot rewrite `:authority` directly: that
        # re-triggers route matching against the internal DNS and yields
        # `route_not_found`.
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: weft-live-host-rewrite-filter
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: weft-worker-dynamic
---
# Upstream host-rewrite from the Lua-set header. Composes with the
# DynamicResolver backend (the rewritten host is what it resolves).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: weft-live-host-rewrite-filter
  namespace: envoy-gateway-system
spec:
  urlRewrite:
    hostname:
      type: Header
      header: x-weft-upstream
---
# Per-pod routing: rewrite the upstream Host from the caller's subdomain
# (`<pod>.<ns>.${GATEWAY_HOST}`) to the pod's internal cluster DNS
# (`<pod>.weft-workers.<ns>.svc.cluster.local`). The DynamicResolver
# backend then forwards there. One snippet handles every pod; the routing
# token (verified inside the worker) is what actually authorizes the
# connection, so a forged subdomain only ever reaches a worker that
# rejects it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: weft-live-host-rewrite
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: weft-live-route
  lua:
    - type: Inline
      inline: |
        -- Map `<pod>.<suffix>` + path `/<ns>/<rest>` ->
        -- upstream host `<pod>.weft-workers.<ns>.svc.cluster.local` and
        -- path `/<rest>`. The POD is the leftmost DNS label (pod names are
        -- DNS-clean: single hyphens only). The NAMESPACE rides the FIRST
        -- PATH SEGMENT, NOT the host, because the project namespace
        -- contains `--` and Envoy/Gateway-API reject any host label with
        -- consecutive hyphens (IDNA punycode reservation). A single-label
        -- `*.` wildcard listener matches `<pod>.<suffix>`. WebSocket
        -- upgrades carry the same Host + path, so this covers both
        -- protocols.
        function envoy_on_request(request_handle)
          local headers = request_handle:headers()
          local host = headers:get(":authority")
          local path = headers:get(":path")
          if host == nil or path == nil then
            return
          end
          -- Pod = leftmost host label (strip any port first).
          local hostport = host
          local colon = string.find(hostport, ":")
          if colon ~= nil then
            hostport = string.sub(hostport, 1, colon - 1)
          end
          local pod = string.match(hostport, "^([^.]+)%.")
          if pod == nil then
            request_handle:logWarn("weft live: unexpected caller host '" .. host .. "'")
            return
          end
          -- Namespace = first path segment; the rest is the real path.
          -- `path` is `/<ns>/<rest...>?<query>`; keep the query intact.
          local ns, rest = string.match(path, "^/([^/?]+)(.*)$")
          if ns == nil then
            request_handle:logWarn("weft live: caller path missing namespace segment '" .. path .. "'")
            return
          end
          if rest == "" or string.sub(rest, 1, 1) == "?" then
            rest = "/" .. rest  -- root path under the namespace
          end
          -- SYNC: per-pod connection FQDN <-> crates/weft-dispatcher/src/api/signal.rs (pod_connection_fqdn). The dispatcher resolves this exact name before handing out the URL.
          local upstream = pod .. ".weft-workers." .. ns .. ".svc.cluster.local:9091"
          -- Set the upstream target in a header the HTTPRouteFilter
          -- rewrites the Host from. Do NOT touch `:authority`: route
          -- matching must keep seeing the original public host, else
          -- Envoy re-routes against the internal DNS and 404s
          -- (route_not_found). Strip the namespace segment from the path.
          headers:replace("x-weft-upstream", upstream)
          headers:replace(":path", rest)
        end
---
# Browser callers. The dispatcher answers `/connect/...` with a 307 to
# this gateway, and a browser following that redirect refuses the reply
# unless THIS hop carries CORS headers too; the dispatcher's permissive
# policy (`permissive_cors` in crates/weft-dispatcher/src/api/mod.rs)
# covers only its own answer. Permissive is right on both hops for the
# same reason: a route's auth is per route (ApiKeyAuth, JwtAuth,
# HmacAuth), so the caller's origin says nothing about whether it may
# call. Envoy answers the preflight (OPTIONS) itself and never forwards
# it to the worker, which would otherwise treat it as a call.
# SYNC: allowMethods <-> crates/weft-core/src/route.rs (HTTP_METHODS)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: weft-live-cors
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: weft-live-route
  cors:
    allowOrigins:
      - "*"
    allowMethods:
      - GET
      - HEAD
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowHeaders:
      - "*"
    exposeHeaders:
      - "*"
    maxAge: 24h
---
# NO IDLE TIMEOUT on the client (caller -> gateway) connection. A live
# caller connection (a WebSocket, or an HTTP stream the worker holds open
# while the workflow thinks: LLM calls, human-in-the-loop pauses) can sit
# idle for minutes or hours and MUST NOT be cut. TWO independent idle
# timeouts must both be disabled:
#   - `streamIdleTimeout`: the PER-STREAM idle (default 5 MINUTES). This is
#     the one that actually cuts a quiet WebSocket or held HTTP stream: it
#     fires when a single stream sees no bytes either way. Disabling it is
#     the whole point of this policy. (It targets the `http` listener only,
#     the one live callers arrive on; `local` and `public` keep their own
#     policies below.)
#   - `idleTimeout`: the CONNECTION-level idle (default ~1h), independent of
#     the per-stream one; disabled too so a kept-alive connection between
#     streams is never reaped.
# `requestReceivedTimeout` is left at its default: it only bounds how long
# the gateway waits to receive the request LINE, which a real caller sends
# immediately; it does not bound the held connection.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: weft-live-no-idle-timeout
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: weft-live-gateway
      sectionName: http
  timeout:
    http:
      # 0s disables each: a quiet live stream/connection stays open.
      streamIdleTimeout: 0s
      idleTimeout: 0s
---
# NO IDLE / DURATION / REQUEST TIMEOUT on the upstream (gateway -> worker)
# hop either, for the same reason: the worker holds the connection for the
# life of the live execution, which is user-controlled and can be long. The
# default upstream request timeout (15s) and any connection idle/duration
# cap would sever a healthy long-lived connection. WebSocket upgrades and
# HTTP streams both ride this route, so the policy targets the route.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: weft-live-no-upstream-timeout
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: weft-live-route
  timeout:
    http:
      # All 0s = disabled: never cut a healthy long-lived live connection.
      connectionIdleTimeout: 0s
      maxConnectionDuration: 0s
      requestTimeout: 0s
  # DNS re-resolution rate for the DynamicResolver upstream. The bug this
  # fixes: a worker pod is spawned on demand for a live connection, but the
  # per-pod cluster DNS record (`<pod>.weft-workers.<ns>.svc.cluster.local`)
  # takes a beat to propagate (EndpointSlice -> CoreDNS). If the caller
  # connects in that gap, Envoy's resolver gets NXDOMAIN and NEGATIVE-CACHES
  # it for `dnsFailureRefreshRate`, which (when unset) defaults to
  # `dnsRefreshRate`. At the old default (30s) a sub-second propagation gap
  # became a ~30s outage for the FIRST caller of every cold pod: 503 "no
  # healthy upstream" until the cached failure expired, even though the
  # record had since appeared. Dropping the refresh to 1s makes a transient
  # NXDOMAIN self-heal within ~1s. `respectDnsTtl` (default true) still
  # governs the SUCCESS path, so warm pods are not re-resolved on this short
  # timer (they follow the record TTL).
  dns:
    dnsRefreshRate: 1s
    respectDnsTtl: true
# NOTE: the Backend API (DynamicResolver) must be enabled in the
# controller's `envoy-gateway-config` ConfigMap (`extensionApis.enableBackend:
# true`), NOT via a CR (`EnvoyGateway` is the config file's kind, not a
# cluster resource). The CLI daemon patches that ConfigMap + restarts the
# controller in `ensure_envoy_gateway`, so it is not applied here.
---
# A caller who VANISHES, and the one thing that notices.
#
# Every timeout above is off on purpose so a healthy feed that stays quiet
# for hours is never cut. That leaves one way to leave unaccounted for. A
# tab closed or a page navigated away sends a goodbye, which Envoy sees at
# once and passes upstream (its own stats show this working: connections
# destroyed remotely, active requests and all). A caller that VANISHES (a
# lid closed, a network gone, a phone that left the building) sends
# NOTHING, and nothing arriving is exactly what a healthy quiet feed looks
# like. Envoy then holds that connection, and the worker's run behind it,
# until the kernel gives up on its own about fifteen minutes later. On a
# page anyone can open that is one wedged run per abandoned tab, for ever.
#
# TCP_USER_TIMEOUT says instead: data unacknowledged this long means the
# far side is gone, fail the connection. Every packet a live machine
# receives is acknowledged by its operating system without anybody asking,
# so a caller who is still there resets this constantly and is never
# touched however long they stay. Only a connection whose bytes go
# nowhere reaches it. That is why this is not a ceiling on the
# conversation: it is a ceiling on SILENCE.
#
# `level: 6` is IPPROTO_TCP and `name: 18` is TCP_USER_TIMEOUT (Linux;
# Envoy takes the raw pair because it has no named field for it). The
# value is milliseconds: 30000 here, matching the worker's own bound on
# its own accepted sockets. `STATE_PREBIND` sets it on the listening
# socket, so every connection it accepts inherits it.
#
# SYNC: 30s <-> crates/weft-engine/src/caller_conn.rs (CALLER_DEAD_AFTER)
#
# Keepalive is deliberately NOT used: the kernel skips its probes entirely
# while any data is in flight (`tp->packets_out`), and a live feed's own
# filler bytes guarantee that for ever, so it would be inert on exactly
# the connections this protects.
#
# Needs `extensionApis.enableEnvoyPatchPolicy: true` in the controller's
# ConfigMap, which the CLI daemon sets alongside the Backend API.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: weft-live-bound-a-vanished-caller
  namespace: envoy-gateway-system
spec:
  type: JSONPatch
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: weft-live-gateway
  jsonPatches:
    - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
      # The xDS listener the Gateway's `http` listener serves on. Each
      # Gateway listener here has a port of its own, so each is its own
      # xDS listener, named after it, and this reaches the live callers
      # only.
      name: envoy-gateway-system/weft-live-gateway/http
      operation:
        op: add
        path: /socket_options
        value:
          - level: 6
            name: 18
            int_value: 30000
            state: STATE_PREBIND
---
# The dispatcher door: every path to the dispatcher Service. Lives in the
# dispatcher's namespace, next to the Service it forwards to, so no
# cross-namespace grant is needed; the `local` listener admits routes
# from every namespace.
# SYNC: weft-dispatcher:9999 <-> deploy/k8s/dispatcher.yaml (Service)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weft-dispatcher-local
  namespace: weft-system
spec:
  parentRefs:
    - name: weft-live-gateway
      namespace: envoy-gateway-system
      sectionName: local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: weft-dispatcher
          port: 9999
---
# The dispatcher door holds what the dispatcher holds: an event stream a
# person follows for as long as a run lasts (the dispatcher keeps it
# alive with a comment every 15s), and requests that wait on the cluster
# for minutes (an infra start). Envoy's defaults would cut both: a route
# timeout of 15s on every request, and a stream that sends nothing for
# five minutes. No request timeout here; an hour of silence on one
# stream, the bound the ingress controller this replaced carried.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: weft-dispatcher-local-no-request-timeout
  namespace: weft-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: weft-dispatcher-local
  timeout:
    http:
      requestTimeout: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: weft-local-stream-idle
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: weft-live-gateway
      sectionName: local
  timeout:
    http:
      streamIdleTimeout: 3600s
---
# The public trigger surface: an ALLOWLIST. Only what these rules match
# passes through to the dispatcher: the provider-events receiver
# (`/events/...`, POST only: a GET there is a private project or
# execution event stream), the token-authenticated per-signal fire door
# (`/signal/...`), the signal-token enumeration surface
# (`/signal-token/...`, the token rides the Authorization header), the
# token-credentialed file relay (`/public/files/...`, minted expiring
# media links), the OAuth callback (exact path, so nothing else under
# `/access` is reachable), and the small static page at the bare root
# (`/`, `/index.html`, `/logo.png`). How a path is normalized before it
# is matched is pinned by `weft-public-path-handling` below.
# Every other path matches no rule, and Envoy answers 404 without the
# dispatcher ever seeing it: the tunnel never exposes the project/admin
# API, the dashboard, or the storage plane itself.
#
# The tunnel terminates TLS, so every rule tells the dispatcher the
# caller came in over https (it builds the links it hands back from the
# request's own Host and X-Forwarded-Proto).
#
# SYNC: the allowlist <-> crates/weft-cli/src/commands/daemon.rs
#       (the public door test), crates/weft-dispatcher/src/api/mod.rs
#       (the routes these paths reach), crates/weft-dispatcher/src/api/public_page.rs
#       (PUBLIC_PAGE_PREFIX)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weft-public-door
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: weft-live-gateway
      sectionName: public
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /events/
          method: POST
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: weft-dispatcher
          namespace: weft-system
          port: 9999
    - matches:
        - path:
            type: PathPrefix
            value: /signal/
        - path:
            type: PathPrefix
            value: /signal-token/
        - path:
            type: PathPrefix
            value: /public/files/
        - path:
            type: Exact
            value: /access/oauth/callback
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: weft-dispatcher
          namespace: weft-system
          port: 9999
    # The bare root's page, served by the dispatcher under a prefix of
    # its own (which is not itself on this listener).
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /index.html
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /public-page/index.html
      backendRefs:
        - name: weft-dispatcher
          namespace: weft-system
          port: 9999
    - matches:
        - path:
            type: Exact
            value: /logo.png
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /public-page/logo.png
      backendRefs:
        - name: weft-dispatcher
          namespace: weft-system
          port: 9999
---
# How the public listener reads a path before it matches the allowlist
# above. The allowlist is a list of prefixes, so a path that reaches the
# dispatcher must be the path Envoy matched: `/signal/../projects`,
# `//projects` or `/signal%2F..%2Fprojects` must never slip past a
# `/signal/` rule and land on `/projects`. Pinned here rather than left to
# Envoy Gateway's defaults: dot segments are resolved and repeated slashes
# merged BEFORE the match (so those land on `/projects`, which no rule
# lets through), and an encoded slash or backslash is refused outright.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: weft-public-path-handling
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: weft-live-gateway
      sectionName: public
  path:
    escapedSlashesAction: RejectRequest
    disableMergeSlashes: false
---
# The public door forwards across namespaces, to the dispatcher Service
# in weft-system: that namespace has to say it allows it.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: weft-public-door-to-dispatcher
  namespace: weft-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Service
      name: weft-dispatcher
---
# A public fire can wait on the run it starts, so Envoy's 15s route
# timeout would cut an answer the dispatcher is still writing. No request
# timeout; a stream silent for Envoy's default five minutes still ends.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: weft-public-door-no-request-timeout
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: weft-public-door
  timeout:
    http:
      requestTimeout: 0s
